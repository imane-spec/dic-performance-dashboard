  <!-- ===========================================================================
     Digital Incubation Center (DIC) — Performance Dashboard
     Ministry of Communications and Information Technology (MCIT), State of Qatar
     ---------------------------------------------------------------------------
     Brand: State of Qatar Master Brand Guidelines.
       Primary  : Al Adaam (maroon) #8A1538, Black #000, White #FFF
       Secondary: Skyline #0D4261, Green #009C80, Blue #4194B3, Sunrise #FDF39E
       (Dune #A29475 is reserved for the Executive branch per the guideline;
        used only on the Overview "Cohort 12 Performance" summary boxes at
        Imane's explicit request — a deliberate exception, not an oversight)
       Typeface : Noto Sans (web substitute for Lusail) -> Calibri -> system.

     Layout: an executive KPI dashboard (7 views) plus an unattended, full-screen
     "display mode" for building/lobby screens. Numbers-first: colour is semantic
     only, charts are hand-built SVG and CSS (no chart library), no icons.

     Data  : ALL values come from data.js (window.DIC_DATA). No data lives here.
             The render logic is fully data-agnostic: swapping data.js re-renders
             everything with no code change. Figures a stream does not carry are
             shown as "Awaiting data" rather than invented.
     ======================================================================== -->

  <style>
    /* ============================ DESIGN TOKENS =============================== */
    :root {
      /* Base palette (Qatar Master Brand) */
      --qatar-maroon: #8A1538;
      --qatar-skyline: #0D4261;
      --qatar-green: #009C80;
      --qatar-blue: #4194B3;
      --qatar-sunrise: #FDF39E;
      /* Maroon ramp */
      --maroon-25: #FBF4F6;
      --maroon-50: #F6E8ED;
      --maroon-100: #EBCDD7;
      --maroon-200: #D9A3B4;
      --maroon-300: #C1718B;
      --maroon-400: #A43C5F;
      --maroon-500: #8A1538;
      --maroon-600: #741230;
      --maroon-700: #5C0E26;
      --maroon-800: #430A1C;
      --maroon-900: #2E0713;
      /* Warm neutrals (rose-warm grey, never tan) */
      --neutral-0: #FFFFFF;
      --neutral-25: #FBF9F9;
      --neutral-50: #F7F4F4;
      --neutral-100: #EFEAEB;
      --neutral-200: #E3DBDD;
      --neutral-300: #CBBFC2;
      --neutral-400: #A6979C;
      --neutral-500: #837378;
      --neutral-600: #66575C;
      --neutral-700: #4C4045;
      --neutral-800: #352C30;
      --neutral-900: #221B1E;
      /* Accent ramps */
      --skyline-50: #E9EFF3;
      --skyline-600: #0D4261;
      --green-50: #E5F5F1;
      --green-600: #007A64;
      --blue-600: #2E7B99;
      --sunrise-50: #FEFBE7;
      --sunrise-100: #FDF39E;
      --sunrise-700: #7A6400;
      /* Semantic surfaces */
      --surface-page: #F7F4F4;
      --surface-card: #FFFFFF;
      --surface-sunken: #EFEAEB;
      --surface-brand-soft: #F6E8ED;
      /* Semantic text */
      --text-primary: #221B1E;
      --text-secondary: #66575C;
      --text-tertiary: #837378;
      --text-brand: #8A1538;
      --text-link: #8A1538;
      /* Borders */
      --border-subtle: #EFEAEB;
      --border-default: #E3DBDD;
      --border-strong: #CBBFC2;
      /* Status */
      --status-success: #007A64;
      --status-success-bg: #E5F5F1;
      --status-info: #2E7B99;
      --status-info-bg: #ECF4F7;
      --status-warning: #7A6400;
      --status-warning-bg: #FEFBE7;
      --status-error: #8A1538;
      --status-error-bg: #F6E8ED;
      /* Interactive */
      --action-ghost-hover: #EFEAEB;
      /* Elevation */
      --shadow-card: 0 1px 2px rgba(34, 27, 30, 0.04), 0 2px 8px rgba(34, 27, 30, 0.05);
      --shadow-card-hover: 0 2px 4px rgba(34, 27, 30, 0.05), 0 8px 20px rgba(34, 27, 30, 0.08);
      --shadow-nav: 0 1px 0 rgba(34, 27, 30, 0.06);
      /* Type */
      --font-sans: "Noto Sans", "Noto Sans Arabic", "Calibri", system-ui, -apple-system, sans-serif;
    }

    /* ============================ BASE ELEMENTS =============================== */
    * {
      box-sizing: border-box
    }

    html,
    body {
      margin: 0
    }

    body {
      font: 400 15px/24px var(--font-sans);
      color: var(--text-primary);
      background: var(--surface-page);
      font-variant-numeric: tabular-nums;
      /* digits must not jitter between states */
      -webkit-font-smoothing: antialiased;
    }

    h1,
    h2,
    p {
      margin: 0
    }

    a {
      color: var(--text-link);
      text-decoration: none
    }

    a:hover {
      color: var(--maroon-600)
    }

    ::selection {
      background: var(--maroon-100)
    }

    button {
      font-family: inherit
    }

    /* ============================ UTILITIES =================================== */
    .card {
      background: var(--surface-card);
      border-radius: 16px;
      box-shadow: var(--shadow-card);
      padding: 24px;
      display: flex;
      flex-direction: column
    }

    .clk {
      cursor: pointer;
      transition: box-shadow 150ms ease-out, transform 150ms ease-out
    }

    .clk:hover {
      box-shadow: var(--shadow-card-hover);
      transform: translateY(-1px)
    }

    .clkd {
      cursor: pointer;
      transition: box-shadow 150ms ease-out, transform 150ms ease-out
    }

    /* Startups tab — ranked-roster row (below the top-3 podium) */
    .dic-startup-row {
      cursor: pointer;
      transition: background 120ms ease-out;
      border-radius: 10px
    }

    .dic-startup-row:hover {
      background: var(--surface-sunken)
    }

    .clkd:hover {
      box-shadow: var(--shadow-card-hover);
      transform: translateY(-2px)
    }

    .tile {
      transition: background 150ms ease-out
    }

    .tile:hover {
      background: var(--action-ghost-hover)
    }

    .rowclk {
      cursor: pointer;
      transition: background 150ms ease-out
    }

    .rowclk:hover {
      background: var(--action-ghost-hover)
    }

    .navpill {
      border: none;
      cursor: pointer;
      flex: none;
      height: 36px;
      padding: 0 11px;
      border-radius: 999px;
      transition: background 150ms ease-out, color 150ms ease-out
    }

    .navpill:hover {
      opacity: .85
    }

    .navmenuitem {
      border: none;
      cursor: pointer;
      width: 100%;
      text-align: left;
      transition: background 120ms ease-out
    }

    .navmenuitem:hover {
      background: var(--action-ghost-hover) !important
    }

    .ghost {
      transition: background 150ms ease-out
    }

    .ghost:hover {
      background: var(--action-ghost-hover)
    }

    .noscroll {
      scrollbar-width: none;
      -ms-overflow-style: none
    }

    .noscroll::-webkit-scrollbar {
      display: none
    }

    .tabbtn {
      border: none;
      background: transparent;
      cursor: pointer;
      position: relative;
      padding: 10px 14px;
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      transition: color 150ms ease-out
    }

    .tabund {
      position: absolute;
      left: 8px;
      right: 8px;
      bottom: -1px;
      height: 3px;
      border-radius: 3px 3px 0 0;
      transition: background 150ms ease-out
    }

    :focus-visible {
      outline: none;
      box-shadow: 0 0 0 2px #FFFFFF, 0 0 0 4px #8A1538
    }

    .eyebrow {
      font: 600 11px/16px var(--font-sans);
      letter-spacing: 0.10em;
      text-transform: uppercase;
      color: #323A8E
    }

    .klabel {
      font: 600 11px/15px var(--font-sans);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-tertiary)
    }

    .ctitle {
      font: 600 11px/16px var(--font-sans);
      color: #323A8E
    }


    .cap {
      font: 400 12px/18px var(--font-sans);
      color: var(--text-tertiary)
    }

    .infotip {
      position: relative;
      display: inline-flex;
      vertical-align: middle;
      margin-left: 6px
    }

    .infoicon {
      width: 16px;
      height: 16px;
      border-radius: 999px;
      background: var(--surface-sunken);
      color: var(--text-tertiary);
      font: 700 11px/16px var(--font-sans);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: help;
      border: 1px solid var(--border-subtle, rgba(0,0,0,0.12))
    }

    .infoicon:hover, .infoicon:focus {
      background: var(--qatar-maroon);
      color: #fff;
      outline: none
    }

    .infobubble {
      position: absolute;
      top: 24px;
      left: 0;
      z-index: 20;
      width: 300px;
      background: #fff;
      border-radius: 10px;
      padding: 12px 14px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.16);
      border: 1px solid var(--border-subtle, rgba(0,0,0,0.10));
      opacity: 0;
      visibility: hidden;
      transform: translateY(-4px);
      transition: opacity 0.12s ease, transform 0.12s ease;
      display: flex;
      flex-direction: column;
      gap: 8px
    }

    .infotip:hover .infobubble, .infotip:focus-within .infobubble {
      opacity: 1;
      visibility: visible;
      transform: translateY(0)
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-radius: 999px;
      padding: 2px 10px;
      font: 600 11px/16px var(--font-sans)
    }

    .chip-lg {
      border-radius: 999px;
      padding: 4px 12px;
      font: 600 12px/16px var(--font-sans)
    }

    .awaiting {
      background: var(--neutral-100);
      color: var(--neutral-700)
    }

    @media (max-width:1200px) {
      .dic-asof {
        display: none
      }
    }

    @media (max-width:1080px) {
      .grid-collapse {
        grid-template-columns: 1fr !important
      }
    }

    /* ============================ RESPONSIVE / MOBILE =========================
       The dashboard's cards use inline `display:grid` layouts throughout (KPI
       rows, per-item table-style rows, filter bars) rather than a small set of
       reusable classes, so — aside from the `.grid-collapse` cards above, which
       were already tagged for it — the lowest-risk way to make every one of
       them stack cleanly on a phone or tablet is a blanket override matched on
       the presence of that inline style, scoped to `#dic-root` so it never
       touches the full-screen Display Mode overlay's kiosk-style boards (those
       stay in their original multi-column layout — Display Mode is built for
       building/lobby screens, not phone browsing). Nothing below changes any
       page's structure or JS; it only changes how existing layouts reflow. ==== */
    @media (max-width:900px) {
      #dic-root [style*="grid-template-columns"] {
        grid-template-columns: 1fr !important
      }
      /* Overview's cohort-health donut + legend + "Requires Attention" panel is
         a flex row (not a grid, so the rule above doesn't reach it) with fixed
         min-widths on its pieces that add up to wider than a tablet/phone
         screen — let it wrap onto its own lines instead of overflowing. */
      .dic-donut-row {
        flex-wrap: wrap !important
      }
    }

    /* The many ".infobubble" hover tooltips scattered across every tab are
       absolutely positioned at a fixed 280-300px width, anchored to their
       "i" icon's position. On a phone that's often wider than the screen
       has room for to the right of the icon — and critically, a hidden
       (unopened) tooltip's box still counts toward the page's scrollable
       width even though nothing is visibly overflowing, which made every
       tab horizontally draggable/scrollable on a phone even before anyone
       tapped an "i" icon. Below this breakpoint, tooltips become a
       bottom-anchored sheet spanning the screen (minus a margin) instead —
       its width is set from fixed left/right viewport offsets rather than
       the icon's position, so it can never push the page wider than the
       screen no matter where its icon sits. Only position/sizing change;
       the existing show-on-hover/focus behaviour is untouched. Same
       breakpoint as the card-grid collapse above, since tablet widths carry
       the same amount of invisible overflow slack as phones do here. */
    @media (max-width:1080px) {
      .infobubble {
        position: fixed !important;
        left: 16px !important;
        right: 16px !important;
        top: auto !important;
        bottom: 16px !important;
        width: auto !important;
        max-width: none !important;
        max-height: 60vh;
        overflow-y: auto;
      }
    }

    /* A handful of rows across Workshops & Talks, Coaching, Mentorship, and
       Social Media Performance pack a fixed-width label (or two) plus a
       flexible bar/text next to it — comfortable on desktop, but the fixed
       widths alone add up to more than a phone screen before the flexible
       part gets any room at all, which was pushing these specific rows
       past the edge of the screen (and, since flexbox won't shrink a row
       below its content's min-width, taking the whole page's scrollable
       width with them). Each fix below is scoped to that one exact row via
       its existing inline style, matched by attribute selector, so nothing
       else on the page is affected. */
    @media (max-width:640px) {
      /* Startup Participation weekly chart (Workshops & Talks): let the
         chart scroll horizontally rather than squeeze its bars unreadably
         thin — every week stays fully legible, just a swipe away. */
      .dic-hscroll-chart {
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        padding-bottom: 4px;
      }
      /* Coaching Hours by Startup: shrink the startup-name and hours/sessions
         labels, and collapse the invisible "Extra Mile" alignment spacer
         (purely cosmetic — nothing visible sits in it) to free up room for
         the bars themselves. */
      #dic-root [style*="width:150px;flex:none;font:400 12.5px/17px"] { width: 84px !important }
      #dic-root [style*="width:96px;flex:none;text-align:right;font:600 11.5px"] { width: 68px !important; font-size: 10.5px !important }
      #dic-root [style*="width:64px;flex:none"] { width: 0 !important }
      /* Logged Hours by Subject (Mentorship): same idea — shrink the subject
         label and the "H h · N sessions" trailing label. */
      #dic-root [style*="width:210px;flex:none;font:400 12.5px/17px"] { width: 108px !important }
      #dic-root [style*="width:132px;flex:none;text-align:right;white-space:nowrap;font:400 12px/16px"] { width: 92px !important; font-size: 11px !important }
      /* Social Media Performance's monthly notes: let the note text drop to
         its own line under the month/platform labels instead of forcing a
         single unbroken line. */
      .dic-note-row { flex-wrap: wrap !important }
    }

    /* Large headline numbers (KPI tiles, funnel boxes) are sized for desktop
       viewing; scale the biggest ones down on phones so they don't force
       horizontal scrolling inside their own card. */
    @media (max-width:640px) {
      #dic-root [style*="font:800 72px"] { font-size: 44px !important; line-height: 46px !important }
      #dic-root [style*="font:800 48px"] { font-size: 34px !important; line-height: 36px !important }
      #dic-root [style*="font:800 36px"] { font-size: 27px !important; line-height: 30px !important }
      #dic-root [style*="font:800 32px"] { font-size: 25px !important; line-height: 28px !important }
    }

    /* Nav bar, tablet and below: the logo, nav pills, group dropdowns, Display
       Mode button, cohort selector, and Sign out button together are wider
       than a tablet or phone viewport can fit on one row. Rather than
       squeeze the flex:1 pill strip down to nothing (which is what happens
       if only the fixed-width items are shrunk), the whole bar becomes one
       horizontally-scrollable strip at this breakpoint — every item keeps
       its natural, tap-friendly size and nothing is ever hidden, it just
       takes a swipe to reach items past the first screenful. Shrinking the
       logo/controls below still helps more of the bar fit before a swipe
       is needed. */
    @media (min-width:769px) and (max-width:1080px) {
      .dic-navbar {
        padding: 0 14px !important;
        gap: 10px !important;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
        -ms-overflow-style: none
      }
      .dic-navbar::-webkit-scrollbar { display: none }
      .dic-navbar > * { flex: none !important }
      .dic-logo-title { font-size: 15.5px !important }
      #dic-nav [data-display="on"] { padding: 0 10px !important; font-size: 11.5px !important }
      #dic-nav select[data-cohort-select] { padding: 6px 8px !important; font-size: 11.5px !important }
      #dic-nav [data-logout] { padding: 0 10px !important; font-size: 11.5px !important }
    }
    @media (max-width:1080px) {
      .dic-logo-sub { display: none }
      .dic-logo-title { font-size: 15.5px !important }
    }

    /* ============================ MOBILE HAMBURGER NAV =========================
       Below 769px, the tab strip, group dropdowns, "as of" text, Display Mode
       button, cohort selector, and sign-out button (everything inside
       .dic-desktop-controls) collapse into a single hamburger icon. Tapping it
       opens #dic-mobilemenu (built by renderMobileMenu()), a full-width list
       carrying every one of those same destinations and controls — nothing
       reachable on desktop is dropped, it just moves into this panel instead
       of being squeezed onto, or scrolled within, the top bar. Tablet widths
       (769-1080px) keep the horizontal-scroll strip above, since there's
       enough room there for it to work reasonably; phones get this instead. */
    @media (max-width:768px) {
      .dic-desktop-controls { display: none !important }
      .dic-hamburger { display: flex !important }
      .dic-navbar { padding: 0 16px !important }
      .dic-nav-row { display: none !important }
    }
    @media (min-width:769px) and (max-width:1080px) {
      .dic-navbar { overflow: visible !important; gap: 0 !important }
      .dic-nav-row { overflow: hidden }
    }
    @media (min-width:769px) {
      .dic-hamburger, #dic-mobilemenu { display: none !important }
    }
    @media (min-width:1081px) {
      .dic-nav-row { justify-content: center }
      .dic-nav-row #dic-navscroll {
        flex: 0 1 auto !important;
        justify-content: center;
      }
    }
    .dic-mobile-navitem:active { background: var(--surface-brand-soft) !important }

    @keyframes dicFillA {
      from {
        transform: scaleX(0)
      }

      to {
        transform: scaleX(1)
      }
    }

    @keyframes dicFillB {
      from {
        transform: scaleX(0)
      }

      to {
        transform: scaleX(1)
      }
    }

    /* ============================ DISPLAY MODE =================================
       As of Round 25, buildOverlay() emits the same fixed-px card scale as the
       rest of the dashboard (kpiTile/execBox/segmentDonut sizes), not the old
       vh-based kiosk type, and the two boards render in normal document flow
       instead of being absolutely stacked and cross-faded — only the current
       board is shown at a time via applyBoard()'s .dic-board-active class.
       That toggle is unconditional (not a mobile-only fallback) since it is
       now the only mechanism that ever shows either board, on any screen
       size.

       As of Round 27, cards kept their natural, content-hugging height and
       the board centered in the available room, with only its type scaling
       via clamp(). Imane asked for the cards to fill the page instead — as
       of Round 30, the active board now stretches (flex:1) to fill all of
       .dic-ov-boards's height, and its own two-row grid gives the main
       content row (the cards) 1fr so it consumes the rest of that height
       beyond the slim bottom info bar, which stays auto-sized. Every card
       already aligns its content with justify-content (center or
       space-between, set per-card above), so a taller card just spreads or
       centers that same content across more height rather than leaving a
       stray gap below it — and the type-scaling clamp() below now factors
       in viewport height as well as width, so a screen that's tall (not
       just wide) also gets bigger numbers, keeping a stretched card's
       content proportionate to it rather than a small cluster floating in
       a lot of empty space. */
    #dic-overlay .dic-board { display: none !important }
    #dic-overlay .dic-board.dic-board-active {
      display: grid !important;
      flex: 1 !important;
      min-height: 0 !important;
      grid-template-rows: 1fr auto !important;
    }
    /* The nested 2x2 tile grids (dmTile / impactTiles) have no row template
       of their own, so once their outer row grows to fill the page they'd
       otherwise size their two implicit rows to content and leave blank
       space below — grid-auto-rows:1fr makes every row-less grid inside
       Display Mode split its container's height evenly instead. This does
       not affect .dic-board.dic-board-active itself, since the explicit
       grid-template-rows above already defines its two rows. */
    #dic-overlay [style*="display:grid"] { grid-auto-rows: 1fr !important }

    /* Type inside the cards scales with the screen via `clamp()` against a
       blend of viewport width AND height, so a big lobby/TV screen shows
       genuinely bigger numbers — whether it's wide, tall, or both — rather
       than the same fixed-px size sitting in extra margin or empty card
       space. Scoped to #dic-overlay only, matching this file's existing
       [style*="..."] pattern, so the rest of the dashboard's identical font
       declarations (e.g. kpiTile's own 32px numbers on Overview) are
       untouched. Below 769px the mobile block further down overrides the
       hero number back to a fixed size, same as before this round. */
    #dic-overlay [style*="font:800 72px"] { font-size: clamp(48px, 3.6vw + 3.6vh, 168px) !important; line-height: 1.05 !important }
    #dic-overlay [style*="font:800 32px"] { font-size: clamp(24px, 1.7vw + 1.7vh, 64px) !important; line-height: 1.08 !important }
    #dic-overlay [style*="font:800 26px"] { font-size: clamp(20px, 1.4vw + 1.4vh, 50px) !important; line-height: 1.12 !important }
    #dic-overlay [style*="font:700 22px"] { font-size: clamp(18px, 1.2vw + 1.2vh, 40px) !important; line-height: 1.25 !important }

    /* Display mode follows the supplied numbers-first signage reference:
       viewport-relative scale, a stable header, full-height card stage, and no
       decorative icon badges competing with the figures. */
    #dic-overlay {
      padding: 3.2vh 3.5vw 2.6vh !important;
      gap: 2.2vh !important;
      overflow: hidden !important;
    }
    #dic-overlay .dic-ov-header { position: relative; min-height: 5.2vh; }

    /* Imane confirmed the phone version reads great, but flagged that on a
       browser (desktop/laptop) the cards still show a lot of white space
       around the type. Cause: the vw+vh coefficients above were tuned low
       enough that, on a desktop viewport, the formula never got anywhere
       near its own clamp() ceiling — e.g. the hero number computed to
       ~88px against a 168px cap at a 1440x1000 reference size, nowhere
       near large enough to visually fill the now-tall (Round 30) stretched
       cards. Phones don't have this gap because Display Mode reverts to
       plain, content-hugging block flow below 769px (see the max-width
       block below) — the card is never stretched taller than its content
       there in the first place. This min-width:769px override only raises
       the coefficients/ceilings used ABOVE that breakpoint, so the phone
       experience Imane already confirmed is unaffected. Ceilings are sized
       against each number's own card so a long value (e.g. "QAR 294M")
       still has room to breathe without overflowing its card at typical
       desktop/monitor widths. */
    @media (min-width:769px) {
      #dic-overlay [style*="font:800 72px"] { font-size: clamp(88px, 6.1vw + 6.1vh, 260px) !important }
      #dic-overlay [style*="font:800 32px"] { font-size: clamp(64px, 3.9vw + 3.9vh, 140px) !important }

      .dic-ov-header { flex-wrap: wrap !important; row-gap: 10px !important }

         matching the Round 24 mobile layout. */

      #dic-overlay [style*="grid-template-columns"] { grid-template-columns: 1fr !important }

      /* Segmented donut (cohort health ring). Rotated -90deg so it starts at 12 o'clock. */

        return ''

         /* + '<div class="card clk" data-view="Methodology" style="gap:16px">'*/
          + '<div class="card" style="gap:16px">'
          + '<div style="display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap"><span class="eyebrow">Programme Impact Since Inception</span>' + scopeChip('programme') + '</div>'

          + (hasSurvival

          + execBox(EXEC_COLORS[1], M.talksDelivered, TALKS_COHORT_SCOPE, 'DIC Talks · ' + fmtSat(M.talkAvgSat) + ' rating', 'Delivery', 'DIC Talks', EXEC_TEXT_DARK[1])

          + '<div style="display:flex;flex-direction:column;gap:8px;flex:none;min-width:130px;padding-top:2px">'

          + legendRow('background:' + HEALTH_COLORS[1], 'At Risk', M.health.risk)

          + '<div style="display:flex;flex-direction:column;gap:10px;flex:1;min-width:220px;background:var(--status-error-bg);border-radius:12px;padding:16px 20px">'

          + '<span style="font:600 12px/16px var(--font-sans);color:var(--text-secondary);text-transform:uppercase;letter-spacing:0.08em">Requires Attention</span>'

          + '<div class="card" style="gap:16px">'

            var stages = M.recruitment.funnel || [];
            var widths = [100, 80, 62, 48, 36];

            var capTpl = ['', 'of views', 'completion rate', 'of submitted', 'of eligible'];
            var funnelRows = stages.map(function (s, i) {
              var w = widths[i] != null ? widths[i] : 30;
              var prev = i > 0 ? stages[i - 1].value : null;

              var taper = 6 + i * 3;
              return '<div style="display:flex;align-items:center;gap:16px">'
                + '<div style="flex:none;width:280px;display:flex;justify-content:center">'

      /* =========================================================================

         ====================================================================== */
      function viewDelivery(M) {
        /* ---- date filter (shared across both sections; session-level charts and
           tables respect it, contract KPI tiles always show the full period) ---- */
        var F = S.deliv;
        var allISO = M.ws.sessions.map(function (s) { return toISO(s.date); })
          .concat(M.talks.sessions.map(function (s) { return toISO(s.date); })).filter(Boolean).sort();
        var minD = allISO[0] || '', maxD = allISO[allISO.length - 1] || '';
        if (!F.init) { F.from = null; F.to = null; F.init = true; }
        var active = !!(F.from || F.to);
        var inRange = function (iso) { return iso ? ((!F.from || iso >= F.from) && (!F.to || iso <= F.to)) : true; };
        var inpStyle = 'font:600 12.5px/18px var(--font-sans);color:var(--text-primary);background:var(--surface-card);border:1px solid var(--border-default);border-radius:8px;padding:6px 10px';
        var fromInp = '<input type="date" data-deliv="from" value="' + esc(F.from || '') + '" min="' + esc(minD) + '" max="' + esc(maxD) + '" style="' + inpStyle + '">';
        var toInp = '<input type="date" data-deliv="to" value="' + esc(F.to || '') + '" min="' + esc(minD) + '" max="' + esc(maxD) + '" style="' + inpStyle + '">';
        var filterBar = '<div class="card" style="flex-direction:row;align-items:center;gap:16px;flex-wrap:wrap;padding:14px 18px">'
          + '<span class="klabel" style="flex:none">Date range</span>'
          + '<div style="display:flex;flex-direction:column;gap:3px"><span class="cap">From</span>' + fromInp + '</div>'
          + '<div style="display:flex;flex-direction:column;gap:3px"><span class="cap">To</span>' + toInp + '</div>'
          + (active ? '<button data-deliv="reset" class="ghost" style="border:1px solid var(--border-default);background:var(--surface-card);border-radius:999px;padding:7px 14px;font:600 12px/16px var(--font-sans);color:var(--text-secondary);cursor:pointer;flex:none">Reset to full range</button>' : '')
          + '<span class="cap" style="margin-left:auto">Narrows the Charts and Tables Below. KPI Tiles Always Show the Full Period to Date.</span>'
          + '</div>';

        var sectionHead = function (label) {
          return '<div style="display:flex;align-items:baseline;gap:10px;padding-top:6px"><h2 class="ctitle" style="font:800 18px/24px var(--font-sans)">' + esc(label) + '</h2><div style="flex:1;height:1px;background:var(--border-subtle)"></div></div>';
        };

        return '<div style="display:flex;flex-direction:column;gap:16px">' + filterBar
          + sectionHead('Workshops') + deliveryWorkshops(M, inRange)
          + sectionHead('DIC Talks') + deliveryTalks(M, inRange)
          + '</div>';
      }

      function kpiTile(big, den, label, color, chipHtml) {
        return '<div class="card" style="padding:20px 18px;justify-content:center;gap:6px">'
          + '<div style="font:800 32px/34px var(--font-sans);letter-spacing:-0.02em;color:' + (color || 'var(--text-primary)') + '">' + big + (den ? '<span style="font:600 16px/18px var(--font-sans);color:var(--text-tertiary)"> ' + den + '</span>' : '') + '</div>'
          + (chipHtml || '')
          + '<div class="klabel">' + label + '</div></div>';
      }

      function deliveryWorkshops(M, inRange) {
        inRange = inRange || function () { return true; };
        /* Cohort scope, not the six-cohort contract total (M.wsScope) — this page
           reports what THIS cohort has delivered against its own 12-workshop plan. */
        var WS_COHORT_SCOPE = 12;
        var attDelta = (M.attTargetNum != null) ? (M.wsAttRate - M.attTargetNum) : null;
        var attChip = (attDelta != null) ? '<div><span class="chip-lg" style="background:' + (attDelta >= 0 ? 'var(--status-success-bg)' : 'var(--status-warning-bg)') + ';color:' + (attDelta >= 0 ? 'var(--status-success)' : 'var(--status-warning)') + '">' + (attDelta >= 0 ? '▲ ' : '▼ ') + Math.abs(attDelta) + ' pts vs ' + M.attTargetStr + ' target</span></div>' : '';
        var kpis = '<div class="grid-collapse" style="display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:14px">'
          + '<div class="card" style="justify-content:center;gap:8px"><div style="font:800 72px/70px var(--font-sans);letter-spacing:-0.02em;color:var(--green-600)">' + M.wsAttRate + '%</div>' + attChip + '<div class="klabel">Workshop attendance · ' + M.wsAttended + ' of ' + M.wsSeats + ' seats</div></div>'
          + kpiTile(M.wsDelivered, '/ ' + WS_COHORT_SCOPE, 'Workshops delivered · ' + esc(S.cohort))
          + kpiTile(M.wsHasSat ? fmtSat(M.wsAvgSat) : '—', '', 'Satisfaction · avg across sessions' + (M.wsHasSat ? '' : ' · awaiting data'), M.wsHasSat ? 'var(--green-600)' : 'var(--text-tertiary)')
          + '</div>';

        /* sessions in the active date range, keeping each session's original
           index so the attendance matrix and optionality rules stay aligned */
        var visible = M.ws.sessions.map(function (s, i) { return { s: s, i: i }; }).filter(function (x) { return inRange(toISO(x.s.date)); });

        /* startups vs people attended — headcount context per session (placeholder
           figures pending real attendance-sheet headcounts, see note below) */
        var maxPeople = Math.max.apply(null, visible.map(function (x) { return x.s.peopleAttended || 0; }).concat([1]));
        var hasPeople = visible.some(function (x) { return typeof x.s.peopleAttended === 'number'; });
        var peopleBars = visible.map(function (x) {
          var s = x.s, i = x.i;
          var sh = Math.round((s.attended || 0) / maxPeople * 130), ph = Math.round((s.peopleAttended || 0) / maxPeople * 130);
          return '<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;justify-content:flex-end">'
            + '<div style="display:flex;align-items:flex-end;gap:5px;height:130px">'
            + '<div title="Startups ' + s.attended + '" style="width:20px;border-radius:5px 5px 0 0;background:var(--qatar-skyline);height:' + sh + 'px"></div>'
            + '<div title="People Attended ' + (s.peopleAttended || 0) + '" style="width:20px;border-radius:5px 5px 0 0;background:var(--qatar-maroon);height:' + ph + 'px"></div></div>'
            + '<span style="font:600 12px/15px var(--font-sans)">W' + (i + 1) + '</span>'
            + '<span style="font:400 10.5px/13px var(--font-sans);color:var(--text-secondary)">' + s.attended + ' / ' + (typeof s.peopleAttended === 'number' ? s.peopleAttended : '—') + '</span></div>';
        }).join('');
        var peopleCard = '<div class="card" style="gap:14px"><div style="display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:8px"><h2 class="ctitle">STARTUP PARTICIPATION</h2>'
          + '<div style="display:flex;gap:14px;font:400 12px/16px var(--font-sans);color:var(--text-secondary)"><span style="display:inline-flex;align-items:center;gap:6px"><span style="width:12px;height:12px;border-radius:3px;background:var(--qatar-skyline)"></span>Startups</span><span style="display:inline-flex;align-items:center;gap:6px"><span style="width:12px;height:12px;border-radius:3px;background:var(--qatar-maroon)"></span>People Attended</span></div></div>'
          + (visible.length ? '<div class="dic-hscroll-chart" style="display:flex;align-items:flex-end;gap:16px">' + peopleBars + '</div>'
            + '<p class="cap">Each Session\'s Startup Count Against Total Attendees, Including Multiple People per Startup.' + (hasPeople ? '' : ' Headcount is Not Yet Recorded in the Workbook.') + '</p>'
            : '<p class="cap">No Workshops Fall within the Selected Date Range.</p>') + '</div>';

        var pointsCard = '<div class="card" style="gap:8px"><div style="display:flex;align-items:baseline;gap:8px"><h2 class="ctitle">ENGAGEMENT POINTS</h2>'
          + '<span class="infotip" tabindex="0"><span class="infoicon">i</span>'
          + '<span class="infobubble" style="width:280px"><span style="font:400 12.5px/18px var(--font-sans);color:var(--text-secondary)">Attendance Rate Answers "Did They Show Up." Points — Earned Automatically on the Same QR Check-in that Records Attendance — Answer "how Consistently Engaged is this Startup across Everything it\'s Invited to." Innovate Awards Points at Every Event Check-in; the Current Workbook has no Point Values to Draw on Yet.</span></span></span>'
          + '</div><span class="chip awaiting" style="align-self:flex-start">Awaiting data</span></div>';

        return kpis + peopleCard + pointsCard;
      }

      function deliveryTalks(M, inRange) {
        inRange = inRange || function () { return true; };
        var visible = M.talks.sessions.map(function (s, i) { return { s: s, i: i }; }).filter(function (x) { return inRange(toISO(x.s.date)); });
        var hidden = M.talks.sessions.length - visible.length;
        var rangeNote = hidden > 0 ? (' ' + hidden + ' talk' + (hidden === 1 ? '' : 's') + ' outside the selected range ' + (hidden === 1 ? 'is' : 'are') + ' hidden.') : '';

        /* funnel and averages recomputed from the sessions in range */
        var hasInvitedF = visible.some(function (x) { return typeof x.s.invited === 'number'; });
        var invitedF = hasInvitedF ? sum(visible.map(function (x) { return x.s.invited || 0; })) : null;
        var rsvpF = sum(visible.map(function (x) { return x.s.rsvp || 0; }));
        var attF = sum(visible.map(function (x) { return x.s.attended || 0; }));
        var satF = visible.filter(function (x) { return typeof x.s.satisfaction === 'number'; });
        var avgSatF = satF.length ? sum(satF.map(function (x) { return x.s.satisfaction; })) / satF.length : null;

        /* funnel: RSVP -> Attended (invited included only where present).
           Three side-by-side stat boxes: label, big number centered, and — on
           every box after the first — the stage-over-stage conversion percentage
           (this stage's value over the previous stage's) centered beneath it. */
        var funnelStages = [];
        if (invitedF != null) funnelStages.push({ label: 'Invited', value: invitedF });
        funnelStages.push({ label: 'RSVPs', value: rsvpF });
        funnelStages.push({ label: 'Attended', value: attF });
        var funnelBoxes = funnelStages.map(function (f, i) {
          var prev = funnelStages[i - 1];
          var pctVal = (i > 0 && prev.value) ? Math.round(f.value / prev.value * 100) : null;
          return '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:26px 16px;background:var(--neutral-25);border:1px solid var(--border-subtle);border-radius:12px">'
            + '<span class="klabel">' + f.label + '</span>'
            + '<span style="font:800 36px/40px var(--font-sans);letter-spacing:-0.02em;color:var(--text-primary)">' + nfmt(f.value) + '</span>'
            + (pctVal != null ? '<span style="font:700 16px/20px var(--font-sans);color:var(--qatar-maroon)">' + pctVal + '%</span>' : '')
            + '</div>';
        }).join('');
        var funnel = '<div style="display:grid;grid-template-columns:repeat(' + funnelStages.length + ',1fr);gap:16px">' + funnelBoxes + '</div>';
        var overallShow = pct(attF, rsvpF);

        /* Per-Talk Detail: merged with the RSVPs-vs-attendance chart into one
           visual — each row's Attendance column carries a paired mini-bar
           (RSVPs skyline over Attended maroon, scaled to the row's own RSVP
           count so an under-invited talk's bars aren't dwarfed by a big one)
           alongside the plain "attended / rsvp" figures. No separate chart
           card or show/hide toggle. */
        var maxRsvp = Math.max.apply(null, visible.map(function (x) { return x.s.rsvp || 0; }).concat([1]));
        var talkLegend = '<span style="display:inline-flex;align-items:center;gap:6px"><span style="width:12px;height:12px;border-radius:3px;background:var(--qatar-skyline)"></span>RSVPs</span><span style="display:inline-flex;align-items:center;gap:6px"><span style="width:12px;height:12px;border-radius:3px;background:var(--qatar-maroon)"></span>Attended</span>';

        var rows = visible.map(function (x) {
          var t = x.s;
          var show = t.rsvp ? (Math.round(t.attended / t.rsvp * 1000) / 10) + '%' : '—';
          var rsvpPct = Math.round((t.rsvp || 0) / maxRsvp * 100), attPct = Math.round((t.attended || 0) / maxRsvp * 100);
          return '<div style="display:grid;grid-template-columns:1.3fr 0.9fr 0.7fr 1.7fr 0.8fr 0.9fr;gap:8px;align-items:center;background:var(--neutral-25);border:1px solid var(--border-subtle);border-radius:12px;padding:12px;font:400 13px/18px var(--font-sans)">'
            + '<span style="font-weight:600">' + esc(t.name) + '</span><span style="color:var(--text-secondary)">' + esc(t.date) + '</span>'
            + '<span style="text-align:right">' + (typeof t.invited === 'number' ? nfmt(t.invited) : '—') + '</span>'
            + '<div style="display:flex;align-items:center;gap:10px">'
            + '<div style="flex:1;display:flex;flex-direction:column;gap:3px">'
            + '<div title="RSVPs ' + t.rsvp + '" style="height:9px;border-radius:3px;background:var(--surface-sunken)"><div style="height:9px;border-radius:3px;background:var(--qatar-skyline);width:' + rsvpPct + '%"></div></div>'
            + '<div title="Attended ' + t.attended + '" style="height:9px;border-radius:3px;background:var(--surface-sunken)"><div style="height:9px;border-radius:3px;background:var(--qatar-maroon);width:' + attPct + '%"></div></div>'
            + '</div>'
            + '<span style="width:66px;flex:none;text-align:right;font:600 12px/16px var(--font-sans);color:var(--text-secondary)">' + t.attended + ' / ' + t.rsvp + '</span>'
            + '</div>'
            + '<span style="text-align:right;color:var(--text-secondary)">' + show + '</span>'
            + '<span style="text-align:right;font-weight:600">' + (typeof t.satisfaction === 'number' ? fmtSat(t.satisfaction) : '—') + '</span></div>';
        }).join('');

        return ''
          + '<div class="grid-collapse" style="display:grid;grid-template-columns:1fr;gap:20px">'
          + '<div class="card" style="gap:16px"><h2 class="ctitle">FROM INVITATION TO ATTENDANCE</h2>' + funnel
          + (visible.length ? '<p style="font:400 13px/19px var(--font-sans);color:var(--text-secondary)">Across ' + visible.length + ' talks in range, <strong>' + nfmt(rsvpF) + ' RSVPs became ' + nfmt(attF) + ' attendees — ' + overallShow + '%</strong>. The counter-signal: those who attend rate the talks around ' + (avgSatF ? fmtSat(avgSatF) : '—') + '.' + (hasInvitedF ? '' : ' Invitation totals are not yet in the workbook, so the funnel starts at RSVPs.') + rangeNote + '</p>'
            : '<p class="cap">No talks fall within the selected date range.</p>') + '</div>'
          + '</div>'
          + '<div class="card" style="gap:10px"><div style="display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap"><h2 class="ctitle">TALKS PERFORMANCE</h2><div style="display:flex;gap:14px;font:400 12px/16px var(--font-sans);color:var(--text-secondary)">' + talkLegend + '</div></div>'
          + '<div style="display:grid;grid-template-columns:1.3fr 0.9fr 0.7fr 1.7fr 0.8fr 0.9fr;gap:8px;padding:6px 12px;font:600 11px/16px var(--font-sans);color:var(--text-tertiary);text-transform:uppercase;letter-spacing:0.06em"><span>Talk</span><span>Date</span><span style="text-align:right">Invited</span><span>Attendance</span><span style="text-align:right">Show rate*</span><span style="text-align:right">Satisfaction</span></div>'
          + (visible.length ? rows : '<p class="cap">No Talks Fall within the Selected Date Range.</p>')
          + '<p class="cap">*Show Rate = Attended ÷ RSVPs. Used Only where RSVPs &gt; 0, per the Data Dictionary.' + rangeNote + '</p>'
          + '</div>';
      }

      /* =========================================================================
         VIEW: STARTUPS (single-startup detail with a selector)
         ====================================================================== */
      /* Shared "initials" fallback for a startup avatar when no logo is set
         (or the logo URL fails to load) — used by the podium, the ranked
         list, and the detail popup so all three render identically. */
      function initialsOf(name) {
        return String(name).replace(/[^A-Za-z ]/g, '').trim().split(/\s+/).slice(0, 2).map(function (w) { return w[0]; }).join('').toUpperCase();
      }
      /* Logo-or-initials avatar, reused by the podium/list/popup. Falls back
         to the initials badge if p.logo is unset or the image 404s. */
      function startupAvatar(p, size, radius, ring) {
        var initials = initialsOf(p.name);
        var border = ring ? (';border:3px solid ' + ring) : '';
        /* display:inline-block is required here — a bare <span> is inline by
           default and inline (non-replaced, non-flex-item) boxes ignore
           explicit width/height entirely, which collapses this wrapper to
           0×0 whenever it isn't itself a direct flex child (e.g. nested one
           level deeper inside the podium's badge-position wrapper below). */
        return '<span style="position:relative;display:inline-block;width:' + size + 'px;height:' + size + 'px;flex:none">'
          + (p.logo ? ('<img src="' + esc(p.logo) + '" alt="' + esc(p.name) + ' logo" style="width:' + size + 'px;height:' + size + 'px;border-radius:' + radius + 'px;object-fit:contain;display:block' + border + '" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'inline-flex\'">') : '')
          + '<span style="width:' + size + 'px;height:' + size + 'px;border-radius:' + radius + 'px;background:var(--surface-brand-soft);color:var(--text-brand);display:' + (p.logo ? 'none' : 'inline-flex') + ';align-items:center;justify-content:center;font:700 ' + Math.round(size * 0.33) + 'px/1 var(--font-sans);position:absolute;inset:0' + border + '">' + esc(initials) + '</span>'
          + '</span>';
      }

      /* Full per-startup detail — logo, status chip, KPI tiles, workshop /
         coaching / talks detail, deliverables, coaching summary, plus (new)
         the Final Ranking card when this startup has a Startup Ranking row.
         This is the same content the Startups tab showed inline before the
         ranking/podium rework; it now renders inside the detail popup
         (startupModal) instead of the page body. */
      function startupDetailBody(p, M) {
        var coach = M.coachByNorm[M.norm(p.name)] || null;
        var prog = M.wpByNorm[M.norm(p.name)] || null;
        var weekHeads = M.weeks.map(function (w) { return w.key; });
        var nW = M.ws.sessions.length;
        var last = null, lastIdx = -1;
        if (prog) { prog.values.forEach(function (v, i) { if (v != null) { last = v; lastIdx = i; } }); }
        var ci = last == null ? { t: 'No Recent Report', bg: 'var(--neutral-100)', c: 'var(--neutral-700)' }
          : (last === 2) ? { t: 'On Track', bg: 'var(--status-success-bg)', c: 'var(--status-success)' }
            : (last === 1) ? { t: 'At Risk', bg: 'var(--status-warning-bg)', c: 'var(--status-warning)' }
              : { t: 'Off Track', bg: 'var(--status-error-bg)', c: 'var(--status-error)' };
        var attCount = (p.att || []).filter(Boolean).length;

        var wsDots = (p.att || []).map(function (a, i) {
          return '<div style="display:flex;flex-direction:column;align-items:center;gap:4px">' + attDot(a, M.wsOptional(p.track, i), i, 22) + '<span style="font:600 10.5px/14px var(--font-sans);color:var(--text-tertiary)">W' + (i + 1) + '</span></div>';
        }).join('');
        var wkCells = (prog ? prog.values : M.weeks.map(function () { return null; })).map(function (v, i) {
          return '<div style="display:flex;flex-direction:column;align-items:center;gap:4px">' + weekCell(v, weekHeads[i] || ('W' + (i + 1)), 24) + '<span style="font:600 9.5px/13px var(--font-sans);color:var(--text-tertiary)">' + esc(weekHeads[i] || ('W' + (i + 1))) + '</span></div>';
        }).join('');

        var c12 = M.talks.cohort12;
        var c12row = (c12 && c12.rows) ? c12.rows.filter(function (r) { return M.norm(r.startup) === M.norm(p.name); })[0] : null;
        var STAT = { attended: 'Attended', none: 'Did Not Attend' };
        var talkBlock = '';
        if (c12 && c12.talks) {
          var td = c12.talks.map(function (t, i) {
            var s = c12row ? c12row.statuses[i] : 'none';
            return '<div style="display:flex;align-items:center;gap:10px">' + talkDot(s, t + ': ' + STAT[s]) + '<span style="font:400 13px/18px var(--font-sans)">' + esc(t) + '</span><span style="margin-left:auto;font:600 11px/16px var(--font-sans);color:var(--text-secondary)">' + STAT[s] + '</span></div>';
          }).join('');
          talkBlock = '<div class="card" style="gap:10px"><h2 class="ctitle">DIC TALKS ATTENDANCE</h2>' + td + '</div>';
        }
        var coachSentence = coach
          ? (coach.attended + ' Sessions Held · ' + hnum(coach.hours) + ' Coaching Hours' + (lastIdx >= 0 ? (' · Latest Status ' + ci.t + ' (' + (weekHeads[lastIdx] || ('W' + (lastIdx + 1))) + ')') : ' · No Weekly Status'))
          : 'This Startup has no Matching Entry in the Coaching Log (Name Reconciliation Pending).';

        /* The Final Ranking card (rank chip, mandatory/coaching/talks tiles,
           base score, final score+bonus) was removed per Imane's feedback —
           mandatory attendance, coaching attendance, DIC Talks attended, and
           the exception sentence now render directly in the ranked-list
           table on the Startups tab (see viewStartups), and Base Score /
           Final Score were dropped outright since Final Score already shows
           in that same table. Nothing ranking-specific renders in this
           popup anymore; it's the same detail every startup always had. */

        return ''
          + '<div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap">'
          + startupAvatar(p, 48, 12)
          + '<div style="display:flex;flex-direction:column;gap:2px"><span style="font:700 22px/28px var(--font-sans)">' + esc(p.name) + (p.exception ? ' *' : '') + '</span><span style="font:400 13px/18px var(--font-sans);color:var(--text-secondary)">' + esc(p.track || '') + '</span></div>'
          + '<span class="chip" style="background:' + ci.bg + ';color:' + ci.c + '">' + ci.t + '</span>'
          + '</div>'
          + '<div class="grid-collapse" style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:16px">'
          + kpiTile(attCount, '/ ' + nW, 'Workshops attended')
          + kpiTile(coach ? hnum(coach.hours) : '—', coach ? 'h' : '', 'Coaching hours', 'var(--green-600)')
          + kpiTile(coach ? coach.attended : '—', '', 'Coaching sessions held')
          + kpiTile(c12row ? c12row.statuses.filter(function (s) { return s === 'attended'; }).length : '—', (c12 && c12.talks) ? ('/ ' + c12.talks.length) : '', 'DIC Talks attended')
          + '</div>'
          + '<div class="grid-collapse" style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px">'
          + '<div class="card" style="gap:12px"><h2 class="ctitle">WORKSHOP ATTENDANCE</h2><div style="display:flex;gap:10px;flex-wrap:wrap">' + wsDots + '</div><p class="cap">Filled = Attended. Dashed Ring = Optional for this Track that Week.</p></div>'
          + '<div class="card" style="gap:12px"><h2 class="ctitle">WEEKLY COACHING STATUS</h2><div style="display:flex;gap:8px;flex-wrap:wrap">' + wkCells + '</div><p class="cap">Green on Track · Yellow at Risk · Maroon off Track · Grey not Reported.</p></div>'
          + '</div>'
          + '<div style="margin-top:20px;display:flex;flex-direction:column;gap:20px">'
          + talkBlock
          /* Deliverables — moved here from the Coaching tab (Round 25), per
             startup rather than as one dashboard-wide card, since a deliverable
             is coach-assigned artefact-by-artefact per startup, not a cohort
             aggregate. Still Awaiting Data: the current workbook has no
             deliverable-submission concept at all yet (Innovate's Deliverables
             feature — coach assigns, startup submits, coach scores — is the
             eventual source), so every startup renders the same honest
             placeholder until that data exists. */
          + '<div class="card" style="gap:8px"><div style="display:flex;align-items:baseline;gap:8px"><h2 class="ctitle">DELIVERABLES</h2>'
          + '<span class="infotip" tabindex="0"><span class="infoicon">i</span>'
          + '<span class="infobubble" style="width:290px"><span style="font:400 12.5px/18px var(--font-sans);color:var(--text-secondary)">Distinct from the Weekly Coaching Status Above: a Deliverable is a Specific, Coach-Assigned Artefact with its own Due Date and Score, not a Judgment Call. Innovate\'s Deliverables Feature (coach Assigns → Startup Submits → Coach Scores) would Populate ' + esc(p.name) + '\'s Submission History and Scores here; the Current Workbook has no Deliverable-Level Data.</span></span></span>'
          + '</div><span class="chip awaiting" style="align-self:flex-start">Awaiting data</span></div>'
          + '<div class="card" style="gap:8px"><h2 class="ctitle">COACHING SUMMARY</h2><p style="font:400 13px/19px var(--font-sans);color:var(--text-secondary)">' + esc(coachSentence) + '</p></div>'
          + '</div>';
      }

      /* Ranked-list column template, shared by the header row and every data
         row so they always line up: Rank | Startup | Mandatory Att. |
         Coaching Att. | DIC Talks | Optional Workshops | Final Score.
         Collapses to one column under 900px via the file's existing
         blanket grid-collapse rule (matched on the inline
         "grid-template-columns" string), same as every other table-style
         row in the dashboard. */
      var STARTUP_ROW_COLS = '0.5fr 2.1fr 1fr 1fr 0.9fr 1.1fr 0.9fr';

      function viewStartups(M) {
        var ranked = M.ranked || [];
        if (!ranked.length) return '<div class="card" style="margin-top:20px">No startups in the roster.</div>';
        var hasException = ranked.some(function (p) { return p.exception; });

        var header = '<div style="display:grid;grid-template-columns:' + STARTUP_ROW_COLS + ';gap:10px;padding:6px 10px;font:600 11px/16px var(--font-sans);color:var(--text-tertiary);text-transform:uppercase;letter-spacing:0.06em">'
          + '<span>Rank</span><span>Startup</span><span style="text-align:right">Mandatory Att.</span><span style="text-align:right">Coaching Att.</span><span style="text-align:right">DIC Talks</span><span style="text-align:right">Optional Workshops</span><span style="text-align:right">Final Score</span>'
          + '</div>';

        /* Mandatory/Coaching attendance, DIC Talks attended, and Optional
           Workshops (exception startups only) render directly in this
           table now (moved out of the detail popup per Imane's feedback) —
           clicking a row still opens the popup for everything else
           (workshop attendance, weekly coaching status, DIC Talks list,
           Deliverables, Coaching Summary). Optional Workshops has its own
           column (rather than a sentence under the row) and exception rows
           get a light-blue highlight so they're easy to spot at a glance. */
        var rows = ranked.map(function (p) {
          return '<div data-startup-open="' + esc(p.name) + '" class="dic-startup-row" style="display:grid;grid-template-columns:' + STARTUP_ROW_COLS + ';gap:10px;align-items:center;padding:12px 10px;border-bottom:1px solid var(--border-subtle,rgba(0,0,0,0.06))' + (p.exception ? ';background:var(--status-info-bg)' : '') + '">'

            + startupAvatar(p, 36, 10)
            + '<div style="display:flex;flex-direction:column;gap:1px;min-width:0"><span style="font:600 14px/18px var(--font-sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(p.name) + (p.exception ? ' *' : '') + '</span><span style="font:400 12px/16px var(--font-sans);color:var(--text-tertiary)">' + esc(p.track || '') + '</span></div>'
            + '</div>'
            + '<span style="text-align:right;font:600 13px/18px var(--font-sans)">' + (p.mandatoryAttPct != null ? p.mandatoryAttPct.toFixed(1) + '%' : '—') + '</span>'
            + '<span style="text-align:right;font:600 13px/18px var(--font-sans)">' + (p.coachingAttPct != null ? p.coachingAttPct.toFixed(0) + '%' : '—') + '</span>'
            + '<span style="text-align:right;font:600 13px/18px var(--font-sans)">' + (p.talksAttended != null ? p.talksAttended + ' / 4' : '—') + '</span>'
            + '<span style="text-align:right;font:600 13px/18px var(--font-sans)">' + (p.exception ? (p.optionalWsAttended || 0) + ' / 4' : '—') + '</span>'
            + '<span style="text-align:right;font:800 15px/20px var(--font-sans);color:var(--qatar-maroon)">' + (p.finalScore != null ? p.finalScore.toFixed(1) : '—') + '</span>'
            + '</div>';

        var listHTML = '<div class="card" style="gap:4px">'
          + '<h2 class="ctitle" style="margin-bottom:6px">ALL STARTUPS · RANKED</h2>'

              + '<div style="background:var(--surface-card);border-radius:18px;max-width:900px;width:100%;padding:24px;box-shadow:0 24px 64px rgba(0,0,0,0.35);position:relative;display:flex;flex-direction:column">'
              + '<button data-startup-close type="button" aria-label="Close" style="position:absolute;top:16px;right:16px;width:32px;height:32px;border-radius:999px;border:1px solid var(--border-default);background:var(--surface-page);cursor:pointer;font:600 16px/1 var(--font-sans);color:var(--text-secondary)">×</button>'
              + startupDetailBody(mp, M)

      /* =========================================================================
         VIEW: COACHING
         ====================================================================== */
      function viewCoaching(M) {
        var kpis = '<div class="grid-collapse" style="display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:14px">'
          + '<div class="card" style="justify-content:center;gap:8px"><div style="display:inline-flex;align-items:baseline;width:max-content;max-width:100%;font:800 58px/60px var(--font-sans);letter-spacing:-0.02em;white-space:nowrap">' + hnum(M.coachHours) + '<span style="font:600 21px/24px var(--font-sans);color:var(--text-tertiary)"> h</span></div><div class="klabel">Coaching Hours Delivered</div><div style="font:400 12px/17px var(--font-sans);color:var(--text-secondary)">model: ' + (M.coach.model ? M.coach.model.hoursPerStartupPerMonth : '—') + ' h × ' + (M.coach.model ? M.coach.model.startups : '—') + ' Startups per Month</div></div>'
          + kpiTile(M.coachMonths != null ? hnum(M.coachMonths) : '—', '/ ' + (M.coachMonthsTotal || '—'), 'Coaching Months Delivered')
          + kpiTile(M.coachHeld, '', 'Sessions held', 'var(--green-600)')
          + '</div>';

        /* "extra mile" proxy — the workbook has no coach-identity column, so this
           flags startups whose avg hours per session held run well above the
           cohort average, which is the closest signal to a coach going beyond
           the standard session length. */
        var avgList = M.coach.byStartup.map(function (c) { return c.attended ? (c.hours / c.attended) : 0; });
        var overallAvg = avgList.length ? (sum(avgList) / avgList.length) : 0;
        /* Clustered (grouped) bar chart — hours delivered and sessions held sit on
           a shared scale, one pair of bars per startup, rendered horizontally so
           all 15 startups read as a plain scrollable list rather than wrapped columns. */
        var sortedCoach = M.coach.byStartup.slice().sort(function (a, b) { return b.hours - a.hours; });
        var maxVal = Math.max.apply(null, sortedCoach.map(function (c) { return Math.max(c.hours || 0, c.attended || 0); }).concat([1]));
        var coachRows = sortedCoach.map(function (c) {
          var avgPerSession = c.attended ? (c.hours / c.attended) : 0;
          var extraMile = overallAvg > 0 && c.attended >= 2 && avgPerSession >= overallAvg * 1.15;
          var hoursPct = Math.round((c.hours || 0) / maxVal * 100), sessPct = Math.round((c.attended || 0) / maxVal * 100);
          return '<div style="display:flex;align-items:center;gap:12px">'
            + '<span style="width:150px;flex:none;font:400 12.5px/17px var(--font-sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="' + esc(c.startup) + '">' + esc(c.startup) + '</span>'
            + '<div style="flex:1;display:flex;flex-direction:column;gap:4px">'
            + '<div title="' + hnum(c.hours) + ' h Delivered" style="height:14px;border-radius:4px;background:var(--surface-sunken)"><div style="height:14px;border-radius:4px;background:var(--qatar-maroon);width:' + hoursPct + '%"></div></div>'
            + '<div title="' + c.attended + ' Sessions Held" style="height:14px;border-radius:4px;background:var(--surface-sunken)"><div style="height:14px;border-radius:4px;background:var(--qatar-skyline);width:' + sessPct + '%"></div></div>'
            + '</div>'
            + '<span style="width:96px;flex:none;text-align:right;font:600 11.5px/15px var(--font-sans);color:var(--text-secondary)">' + hnum(c.hours) + 'h / ' + c.attended + '</span>'
            + (extraMile ? '<span title="Avg ' + avgPerSession.toFixed(1) + ' h/Session vs Cohort AVG ' + overallAvg.toFixed(1) + ' h — flagged as going the extra mile" style="flex:none;white-space:nowrap;font:600 9px/12px var(--font-sans);color:var(--status-success);background:var(--status-success-bg);border-radius:999px;padding:2px 7px">Extra Mile</span>' : '<span style="width:64px;flex:none"></span>')
            + '</div>';
        }).join('');
        var coachLegend = '<span style="display:inline-flex;align-items:center;gap:6px"><span style="width:12px;height:12px;border-radius:3px;background:var(--qatar-maroon)"></span>Hours Delivered</span>'
          + '<span style="display:inline-flex;align-items:center;gap:6px"><span style="width:12px;height:12px;border-radius:3px;background:var(--qatar-skyline)"></span>Sessions Held</span>';

        /* Coach Coverage card removed per Imane's request (Round 25) — see the
           decisions log; the Deliverables card that used to sit next to it here
           moved to each startup's own page on the Startups tab instead, see
           viewStartups(). */
        return kpis
          + '<div class="card" style="gap:14px"><div style="display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:8px"><h2 class="ctitle">Coaching Hours by Startup <span class="cap">· Hours Delivered and Sessions Held</span></h2><div style="display:flex;gap:14px;font:400 12px/16px var(--font-sans);color:var(--text-secondary)">' + coachLegend + '</div></div>'
          + '<div style="display:flex;flex-direction:column;gap:10px">' + coachRows + '</div>'
          + '<p class="cap">Paired Bars per Startup: Hours Delivered (maroon) and Sessions Held (skyline), on a Shared Scale. "Extra Mile" Flags a Startup whose Average Hours per Session Runs at Least 15% Above the Cohort Average — the Workbook Records Coaching per Startup, not per Coach, so This is the Closest Available Signal to a Coach going Beyond the Standard Session Length. Sorted by Hours.</p></div>';
      }

            + '<p class="cap">Delivery Reconciles as ' + d.advisory + ' Advisory Hours Plus ' + d.whitePaper + ' White-Paper Hours = ' + d.delivered + ' of ' + d.scoped + ' Scoped, Leaving ' + d.remaining + '. Advisory Sessions Carry No Dates in the Log, so No Monthly Trend is Drawn.</p></div>';
        } else {
          reconciled = '<div class="card" style="gap:14px"><h2 class="ctitle">Logged Delivery' + whyFilterTip + '</h2>'

            + '<span class="klabel">Logged Across ' + M.menSessions + ' Sessions</span></div>'
            + '<p class="cap">Sessions Carry No Dates in the Log, so No Monthly Trend is Drawn.</p></div>';

            + '<span style="font:400 11.5px/16px var(--font-sans);color:var(--text-tertiary)">Add a Session-Date Column to the Mentorship Log to Unlock this Trend — Once Populated, this Tooltip Renders the Actual Monthly Pattern with No Further Changes Needed.</span>';
        }
        var monthlyInfoTip = '<span class="infotip" tabindex="0"><span class="infoicon">i</span>'
          + '<span class="infobubble" style="width:280px">' + monthlyTipBody + '</span></span>';

        var cohortCard = '<div class="card" style="gap:12px"><h2 class="ctitle">MENTORSHIP HOURS BY COHORT' + monthlyInfoTip + '</h2>'

        var subjectInfoTip = '<span class="infotip" tabindex="0"><span class="infoicon">i</span>'
          + '<span class="infobubble">'
          + '<span style="display:flex;align-items:flex-start;gap:8px;background:var(--status-warning-bg);border-radius:8px;padding:10px 12px"><span style="font:400 12.5px/18px var(--font-sans);color:var(--status-warning)"><strong>"Lead" is a Catch-All Label</strong> Holding ' + M.menLead + ' of ' + M.menLogged + ' Logged Hours (' + leadPct + '%). Until it is Recoded Into Real Subjects, the by-Subject Split Describes the Labelling, not the Advisory Mix.</span></span>'
          + '<span style="font:400 12.5px/18px var(--font-sans);color:var(--text-secondary)">' + M.menMentors + ' Mentors are Recorded Across ' + M.menSessions + ' Sessions. Advisory Versus White-Paper Attribution is not Split in the Source, so Both are Reported Here as One Logged Total.</span>'

        var subjectsCard = '<div class="card" style="gap:12px"><h2 class="ctitle">LOGGED HOURS BY SUBJECT · COHORT 12' + subjectInfoTip + ' <span class="cap">· ' + M.menSessions + ' sessions, ' + M.menLogged + ' h</span></h2>' + bars + '<p class="cap">Scoped to Cohort 12, the Only Cohort with Mentorship Requests Logged. This List will Filter by the Selected Cohort Above Once Other Cohorts have Logged Sessions.</p></div>';

        /* Mentor Connections Facilitated card removed per Imane's request
