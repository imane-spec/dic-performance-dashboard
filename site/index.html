      /* =========================================================================
         VIEW: COMMUNITY
         ====================================================================== */
      function followerSVG(M) {
        var platforms = (M.sm.platforms || []);
        if (!platforms.length) return '';
        var n = M.months.length;
        var L = 44, R = 632, T = 20, B = 196;
        var xstep = n > 1 ? (R - L) / (n - 1) : 0;
        var X = function (i) { return L + i * xstep; };
        var all = []; platforms.forEach(function (p) { all = all.concat(p.metrics.followers); });
        var vmin = Math.min.apply(null, all), vmax = Math.max.apply(null, all);
        var span = (vmax - vmin) || 1000;
        var top = vmax + span * 0.15, bot = Math.max(0, vmin - span * 0.15);
        var Y = function (v) { return T + (top - v) / (top - bot) * (B - T); };
        /* gridlines at round thousands */
        var gl = []; var lo = Math.ceil(bot / 1000) * 1000, hi = Math.floor(top / 1000) * 1000;
        var stepK = (hi - lo) > 4000 ? 2000 : 1000;
        for (var v = lo; v <= hi && gl.length < 5; v += stepK) gl.push(v);
        var gridHtml = gl.map(function (v) {
          return '<line x1="' + L + '" x2="' + R + '" y1="' + Y(v).toFixed(1) + '" y2="' + Y(v).toFixed(1) + '" stroke="var(--border-subtle)" stroke-width="1"></line>'
            + '<text x="' + (L - 6) + '" y="' + (Y(v) + 3).toFixed(1) + '" text-anchor="end" font-size="10" fill="var(--neutral-500)" font-family="Noto Sans">' + Math.round(v / 1000) + 'k</text>';
        }).join('');
        var colorOf = { facebook: 'var(--qatar-skyline)', instagram: 'var(--qatar-maroon)', linkedin: 'var(--qatar-blue)' };
        var paths = platforms.map(function (p) {
          var d = p.metrics.followers.map(function (v, i) { return (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1); }).join(' ');
          return '<path d="' + d + '" fill="none" stroke="' + (colorOf[p.key] || 'var(--qatar-skyline)') + '" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path>';
        }).join('');
        var band = '';
        if (M.maskedIdx >= 0) { var bw = Math.min(44, xstep || 44); var bx = X(M.maskedIdx) - bw / 2; band = '<rect x="' + bx.toFixed(0) + '" y="12" width="' + bw.toFixed(0) + '" height="184" fill="var(--neutral-100)"></rect><text x="' + X(M.maskedIdx).toFixed(0) + '" y="206" text-anchor="middle" font-size="9.5" fill="var(--neutral-500)" font-family="Noto Sans">paused</text>'; }
        var ticks = M.months.map(function (m, i) { return { x: X(i).toFixed(0), label: m.split(' ')[0], i: i }; }).filter(function (t) { return t.i % 2 === 0; })
          .map(function (t) { return '<text x="' + t.x + '" y="220" text-anchor="middle" font-size="10" fill="var(--neutral-500)" font-family="Noto Sans">' + esc(t.label) + '</text>'; }).join('');
        return '<svg viewBox="0 0 640 224" style="width:100%;height:auto;display:block">' + band + gridHtml + paths + ticks + '</svg>';
      }

      function viewCommunity(M) {
        var platforms = M.sm.platforms || [];
        var colorOf = { facebook: 'var(--qatar-skyline)', instagram: 'var(--qatar-maroon)', linkedin: 'var(--qatar-blue)' };
        var stats = platforms.map(function (p) {
          var f = p.metrics.followers; var last = f[f.length - 1], delta = last - f[0];
          var posts = sum(p.metrics.posts);
          var bg = colorOf[p.key] || 'var(--qatar-skyline)';
          return '<div class="card" style="padding:18px;justify-content:center;gap:6px;background:' + bg + '"><span style="font:600 12px/16px var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:#fff">' + esc(p.label) + '</span>'
            + '<span style="font:800 32px/34px var(--font-sans);letter-spacing:-0.02em;color:#fff">' + nfmt(last) + '</span>'
            + '<span class="klabel" style="color:rgba(255,255,255,0.85)">Followers · ' + (delta >= 0 ? '+' : '−') + nfmt(Math.abs(delta)) + ' · ' + posts + ' posts</span></div>';
        }).join('');

        var legend = platforms.map(function (p) { var f = p.metrics.followers; return '<span style="display:inline-flex;align-items:center;gap:6px"><span style="width:14px;height:3px;border-radius:2px;background:' + (colorOf[p.key] || 'var(--qatar-skyline)') + '"></span>' + esc(p.label) + ' ' + nfmt(f[f.length - 1]) + '</span>'; }).join('');

        /* monthly activity bars for the selected platform */
        var sel = M.platOf(S.platform) || platforms[0];
        var maxPosts = Math.max.apply(null, (sel ? sel.metrics.posts : []).filter(function (v, i) { return i !== M.maskedIdx; }).concat([1]));
        var monthBars = sel ? M.months.map(function (m, i) {
          var posts = sel.metrics.posts[i] || 0;
          var er = sel.metrics.engagementRate ? sel.metrics.engagementRate[i] : null;
          var masked = i === M.maskedIdx;
          var hgt = masked ? 110 : Math.max(3, Math.round(posts / maxPosts * 110));
          var tip = masked ? (m + ' — no activity (paused)') : (m + ' · ' + posts + ' posts' + (er != null ? ' · engagement rate ' + er + '%' : ''));
          return '<div title="' + esc(tip) + '" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;justify-content:flex-end;height:100%">'
            + '<span style="font:600 11.5px/14px var(--font-sans);color:' + (masked ? 'var(--text-tertiary)' : 'var(--text-primary)') + '">' + (masked ? '—' : posts) + '</span>'
            + '<div style="width:100%;max-width:34px;border-radius:5px 5px 0 0;background:' + (masked ? 'var(--neutral-50)' : 'var(--qatar-skyline)') + ';border:' + (masked ? '1.5px dashed var(--neutral-300)' : '1px solid transparent') + ';height:' + hgt + 'px"></div>'
            + '<span style="font:400 10.5px/13px var(--font-sans);color:var(--text-tertiary)">' + esc(m.split(' ')[0]) + '</span>'
            + '<span style="font:400 10.5px/13px var(--font-sans);color:var(--text-secondary)">' + (masked ? 'paused' : (er != null ? er.toFixed(1) + '%' : '—')) + '</span></div>';
        }).join('') : '';
        var platTabs = platforms.map(function (p) {
          var on = S.platform === p.key;
          return '<button class="tabbtn" data-plat="' + p.key + '" style="font:' + (on ? '600' : '400') + ' 14px/20px var(--font-sans);color:' + (on ? 'var(--text-brand)' : 'var(--text-secondary)') + '">' + esc(p.label) + '<span class="tabund" style="background:' + (on ? 'var(--qatar-maroon)' : 'transparent') + '"></span></button>';
        }).join('');
        var erCaption = S.platform === 'linkedin' ? 'engagement rate as reported by the platform' : 'engagement rate as published by the platform';

        var notes = (M.sm.postNotes || []).map(function (nn) { return '<div class="dic-note-row" style="display:flex;gap:12px;align-items:baseline"><span style="width:120px;flex:none;font:600 12.5px/18px var(--font-sans)">' + esc(nn.month) + '</span><span style="width:130px;flex:none;font:400 12px/18px var(--font-sans);color:var(--text-tertiary)">' + esc(nn.platform) + '</span><span style="font:400 13px/19px var(--font-sans);color:var(--text-secondary)">' + esc(nn.note) + '</span></div>'; }).join('');

        var m0 = M.months[0] || '', mN = M.months[M.months.length - 1] || '';

        return ''
          + '<div style="display:flex;flex-direction:column;gap:20px">'
          + '<div class="grid-collapse" style="display:grid;grid-template-columns:1.35fr repeat(3,1fr);gap:14px">'
          + '<div class="card" style="padding:20px;justify-content:center;gap:8px"><span style="font:800 48px/48px var(--font-sans);letter-spacing:-0.02em">' + nfmt(M.totalFollowers) + '</span><div><span class="chip-lg" style="background:var(--status-success-bg);color:var(--status-success)">' + (M.followerDelta >= 0 ? '▲ ' : '▼ ') + nfmt(Math.abs(M.followerDelta)) + ' since ' + esc(m0) + '</span></div><span class="klabel">Total Followers · ' + esc(mN) + '</span></div>'
          + stats
          + '</div>'
          + '<div class="card" style="gap:12px"><h2 class="ctitle">FOLLOWER GROWTH · ' + esc(m0) + ' – ' + esc(mN) + '</h2>' + followerSVG(M) + '<div style="display:flex;gap:16px;flex-wrap:wrap;font:400 12px/16px var(--font-sans);color:var(--text-secondary)">' + legend + '</div><p class="cap">' + (M.maskedIdx >= 0 ? 'The Paused Month is Shaded, Not Plotted as Zero; Follower Counts Are Carried Forward. ' : '') + 'Counts Are as Reported by Each Platform.</p></div>'
          + '<div class="card" style="gap:14px"><div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap"><h2 class="ctitle">MONTHLY ACTIVITY BY PLATFORM</h2><div role="tablist" style="display:flex;gap:4px;border-bottom:1px solid var(--border-default)">' + platTabs + '</div></div>'
          + '<div style="display:flex;align-items:flex-end;gap:8px;height:150px">' + monthBars + '</div>'
          + '<p class="cap">Bars = Posts Published; the Row Beneath = ' + erCaption + '. Rates are Shown Within a Platform Only — Follower-Based Rates are Not Comparable Across Platforms, and No Rate is Shown for a Month with Zero Posts.</p></div>'
          + '<div class="card" style="gap:10px"><h2 class="ctitle">CONTEXT FOR NOTABLE MONTHS</h2>' + notes + '</div>'
          + '</div>';
      }

      /* =========================================================================
         VIEW: PERKS — Perk Activation Turnaround Improvement
         ====================================================================== */
      function perkLineChart(cohorts, target) {
        if (!cohorts.length) return '<p class="cap">No completed request cohorts match the current filters.</p>';
        var W = 720, H = 300, xL = 44, xR = 700, yT = 24, yB = 250;
        var meds = cohorts.map(function (c) { return c.median; });
        var yMax = Math.max.apply(null, meds.concat([target]));
        yMax = Math.ceil((yMax * 1.15) / 5) * 5 || 5;
        var n = cohorts.length;
        var X = function (i) { return n <= 1 ? (xL + xR) / 2 : xL + i * (xR - xL) / (n - 1); };
        var Y = function (v) { return yB - (v / yMax) * (yB - yT); };
        // y gridlines (0, target, yMax and a mid)
        var ticks = []; for (var t = 0; t <= yMax; t += (yMax <= 20 ? 5 : 10)) ticks.push(t);
        var grid = ticks.map(function (v) { return '<line x1="' + xL + '" x2="' + xR + '" y1="' + Y(v).toFixed(1) + '" y2="' + Y(v).toFixed(1) + '" stroke="var(--border-subtle)" stroke-width="1"></line><text x="' + (xL - 8) + '" y="' + (Y(v) + 3).toFixed(1) + '" text-anchor="end" font-size="10" fill="var(--neutral-500)" font-family="Noto Sans">' + v + '</text>'; }).join('');
        // target line at 14
        var tgt = '<line x1="' + xL + '" x2="' + xR + '" y1="' + Y(target).toFixed(1) + '" y2="' + Y(target).toFixed(1) + '" stroke="var(--status-warning)" stroke-width="1.5" stroke-dasharray="5 4"></line>'
          + '<text x="' + xR + '" y="' + (Y(target) - 6).toFixed(1) + '" text-anchor="end" font-size="10.5" fill="var(--status-warning)" font-family="Noto Sans">Target ' + target + ' days</text>';
        var pathD = cohorts.map(function (c, i) { return (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(c.median).toFixed(1); }).join(' ');
        var pts = cohorts.map(function (c, i) {
          var tip = fmtDMY(c.date) + ' · ' + c.n + ' completed request' + (c.n === 1 ? '' : 's') + ' · median ' + c.median + ' days · average ' + c.avg + ' days';
          return '<circle cx="' + X(i).toFixed(1) + '" cy="' + Y(c.median).toFixed(1) + '" r="4.5" fill="var(--qatar-maroon)"><title>' + esc(tip) + '</title></circle>'
            + '<text x="' + X(i).toFixed(1) + '" y="' + (Y(c.median) - 11).toFixed(1) + '" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--text-primary)" font-family="Noto Sans">' + c.median + '</text>'
            + '<text x="' + X(i).toFixed(1) + '" y="' + (yB + 16) + '" text-anchor="middle" font-size="9.5" fill="var(--neutral-500)" font-family="Noto Sans">' + fmtDMY(c.date).slice(0, 5) + '</text>';
        }).join('');
        return '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto;display:block">' + grid + tgt + '<path d="' + pathD + '" fill="none" stroke="var(--qatar-maroon)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path>' + pts + '</svg>';
      }

      function viewPerks(M) {
        var pk = M.perks || { records: [] };
        var recs = pk.records || [];
        var target = pk.targetDays || 14;
        var F = S.perk;
        var uniq = function (key) { var s = {}; recs.forEach(function (r) { if (r[key]) s[r[key]] = 1; }); return Object.keys(s).sort(); };
        var providers = uniq('provider'), startupsL = uniq('startup'), servicesL = uniq('service'), statusesL = (pk.statuses && pk.statuses.length) ? pk.statuses : uniq('status');
        var reqDates = recs.map(function (r) { return r.requested; }).filter(Boolean).sort();
        var minD = reqDates[0] || '', maxD = reqDates[reqDates.length - 1] || '';
        if (!F.init) { F.from = minD; F.to = maxD; F.init = true; }

        var inRange = function (iso) { return iso ? ((!F.from || iso >= F.from) && (!F.to || iso <= F.to)) : false; };
        var passStatus = function (r) { return F.status === 'all' ? true : F.status === 'completed' ? r.completed : r.status === F.status; };
        var base = recs.filter(function (r) {
          return (F.provider === 'All' || r.provider === F.provider)
            && (F.startup === 'All' || r.startup === F.startup)
            && (F.service === 'All' || r.service === F.service)
            && passStatus(r) && inRange(r.requested);
        });
        var analysis = base.filter(function (r) { return typeof r.days === 'number' && r.days >= 0 && r.completed; });

        var byDate = {};
        analysis.forEach(function (r) { (byDate[r.requested] = byDate[r.requested] || []).push(r.days); });
        var cohorts = Object.keys(byDate).sort().map(function (d) { var ds = byDate[d]; return { date: d, n: ds.length, median: median(ds), avg: round1(mean(ds)) }; });
        var hasC = cohorts.length > 0;
        var initM = hasC ? cohorts[0].median : null, lateM = hasC ? cohorts[cohorts.length - 1].median : null;
        var reduction = (initM != null && lateM != null) ? (initM - lateM) : null;
        var pctImp = (initM) ? Math.round((initM - lateM) / initM * 100) : null;
        var best = hasC ? Math.min.apply(null, cohorts.map(function (c) { return c.median; })) : null;
        var within = analysis.length ? Math.round(analysis.filter(function (r) { return r.days <= target; }).length / analysis.length * 100) : null;

        var provLabel = F.provider === 'All' ? 'Perk and Service' : F.provider;

        /* ---- filters ---- */
        var selStyle = 'font:600 12.5px/18px var(--font-sans);color:var(--text-primary);background:var(--surface-card);border:1px solid var(--border-default);border-radius:8px;padding:7px 10px;cursor:pointer;max-width:220px';
        var inpStyle = 'font:600 12.5px/18px var(--font-sans);color:var(--text-primary);background:var(--surface-card);border:1px solid var(--border-default);border-radius:8px;padding:6px 10px';
        function opt(v, label, cur) { return '<option value="' + esc(v) + '"' + (String(cur) === String(v) ? ' selected' : '') + '>' + esc(label) + '</option>'; }
        function selField(name, label, html) { return '<div style="display:flex;flex-direction:column;gap:4px"><span class="klabel">' + label + '</span>' + html + '</div>'; }
        var statSel = '<select data-perk="status" style="' + selStyle + '">' + opt('completed', 'Completed Only', F.status) + opt('all', 'All Statuses', F.status) + statusesL.map(function (v) { return opt(v, v, F.status); }).join('') + '</select>';
        var startSel = '<select data-perk="startup" style="' + selStyle + '">' + opt('All', 'All Startups', F.startup) + startupsL.map(function (v) { return opt(v, v, F.startup); }).join('') + '</select>';
        var svcSel = '<select data-perk="service" style="' + selStyle + '">' + opt('All', 'All Services', F.service) + servicesL.map(function (v) { return opt(v, v, F.service); }).join('') + '</select>';
        var fromInp = '<input type="date" data-perk="from" value="' + esc(F.from || '') + '" min="' + esc(minD) + '" max="' + esc(maxD) + '" style="' + inpStyle + '">';
        var toInp = '<input type="date" data-perk="to" value="' + esc(F.to || '') + '" min="' + esc(minD) + '" max="' + esc(maxD) + '" style="' + inpStyle + '">';
        var filters = '<div class="card" style="gap:12px"><div style="display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap"><h2 class="ctitle">FILTERS</h2><button data-perk="reset" class="ghost" style="border:1px solid var(--border-default);background:var(--surface-card);border-radius:999px;padding:6px 12px;font:600 12px/16px var(--font-sans);color:var(--text-secondary);cursor:pointer">Reset to default</button></div>'
          + '<div style="display:flex;gap:14px;flex-wrap:wrap">' + selField('status', 'Status', statSel) + selField('startup', 'Startup', startSel) + selField('service', 'Service or Perk', svcSel) + selField('from', 'Requested from', fromInp) + selField('to', 'Requested to', toInp) + '</div>'
          + '<p class="cap">Default View: Completed Requests Only, All Startups, Full Date Range.</p></div>';

        /* ---- KPI cards ---- */
        var kfmt = function (v, u) { return v == null ? '—' : (v + (u ? '' : '')); };
        var kpis = '<div class="grid-collapse" style="display:grid;grid-template-columns:repeat(5,1fr);gap:14px">'
          + kpiTile(initM == null ? '—' : initM, initM == null ? '' : 'days', 'Initial turnaround')
          + kpiTile(lateM == null ? '—' : lateM, lateM == null ? '' : 'days', 'Latest turnaround', (reduction != null && reduction >= 0) ? 'var(--green-600)' : 'var(--text-primary)')
          + kpiTile(pctImp == null ? '—' : pctImp + '%', '', 'Percentage improvement', (pctImp != null && pctImp >= 0) ? 'var(--green-600)' : 'var(--status-warning)')
          + kpiTile(best == null ? '—' : best, best == null ? '' : 'days', 'Best turnaround achieved', 'var(--green-600)')
          + kpiTile(within == null ? '—' : within + '%', '', 'Within ' + target + '-day target')
          + '</div>';

        /* ---- insight ---- */
        var insight = '';
        if (hasC) {
          var dir = reduction >= 0 ? 'Decreased' : 'Increased';
          var redWord = reduction >= 0 ? ('A Reduction of ' + reduction + ' Days, or Approximately ' + pctImp + '% Improvement') : ('An Increase of ' + (-reduction) + ' Days (' + Math.abs(pctImp) + '%)');
          insight = provLabel + ' Activation Turnaround ' + dir + ' from <strong>' + initM + ' Days</strong> for the Earliest Request Cohort (' + fmtDMY(cohorts[0].date) + ') to <strong>' + lateM + ' Days</strong> for the Latest Completed Cohort (' + fmtDMY(cohorts[cohorts.length - 1].date) + '). This Represents ' + redWord + '. The best Turnaround Achieved was <strong>' + best + ' Days</strong>.';
        } else {
          insight = 'No Completed Request Cohorts Match the Current Filters, So No Turnaround Trend Can Be Computed.';
        }

        /* ---- cohort detail table (used for the line chart) ---- */
        var cohRows = cohorts.map(function (c) {
          return '<div style="display:grid;grid-template-columns:1.2fr 0.8fr 0.8fr 0.8fr;gap:8px;padding:8px 12px;font:400 13px/18px var(--font-sans);background:var(--neutral-25);border:1px solid var(--border-subtle);border-radius:10px"><span style="font-weight:600">' + fmtDMY(c.date) + '</span><span style="text-align:right">' + c.n + '</span><span style="text-align:right;font-weight:600">' + c.median + '</span><span style="text-align:right;color:var(--text-secondary)">' + c.avg + '</span></div>';
        }).join('');
        var cohTable = '<div class="card" style="gap:10px"><h2 class="ctitle">MEDIAN DAYS TO ACTIVATE BY REQUEST COHORT</h2>'
          + '<div style="background:var(--status-info-bg);border-radius:10px;padding:12px 14px"><span class="klabel" style="color:var(--status-info)">Key insight</span><p style="font:400 14px/22px var(--font-sans);color:var(--text-secondary);margin-top:4px">' + insight + '</p></div>'
          + perkLineChart(cohorts, target)
          + '<div style="display:flex;flex-wrap:wrap;gap:16px;font:400 12px/16px var(--font-sans);color:var(--text-secondary)"><span style="display:inline-flex;align-items:center;gap:6px"><span style="width:16px;height:2.5px;background:var(--qatar-maroon)"></span>Median Days</span><span style="display:inline-flex;align-items:center;gap:6px"><span style="width:16px;height:0;border-top:2px dashed var(--status-warning)"></span>14-Day Target</span></div>'
          + (hasC ? ('<div style="display:flex;flex-direction:column;gap:6px;margin-top:4px"><div style="display:grid;grid-template-columns:1.2fr 0.8fr 0.8fr 0.8fr;gap:8px;padding:4px 12px;font:600 11px/16px var(--font-sans);color:var(--text-tertiary);text-transform:uppercase;letter-spacing:0.06em"><span>Request cohort</span><span style="text-align:right">Completed</span><span style="text-align:right">Median days</span><span style="text-align:right">Average days</span></div>' + cohRows + '</div>') : '')
          + '<p class="cap">Median is the Primary Measure because it is Less Affected by a few Unusually Delayed Requests. The Tooltip and Table also Show the Average and the Number of Completed Requests per Cohort.</p></div>';

        /* ---- delayed >21 ---- */
        var delayed = analysis.filter(function (r) { return r.days > 21; }).sort(function (a, b) { return b.days - a.days; });
        var delRows = delayed.map(function (r) {
          return '<div style="display:grid;grid-template-columns:1fr 1.4fr 0.8fr 0.8fr 0.6fr 0.7fr;gap:8px;align-items:center;padding:10px 12px;background:var(--neutral-25);border:1px solid var(--border-subtle);border-radius:10px;font:400 12.5px/17px var(--font-sans)"><span style="font-weight:600">' + esc(r.startup) + '</span><span style="color:var(--text-secondary)">' + esc(r.service) + '</span><span>' + fmtDMY(r.requested) + '</span><span>' + fmtDMY(r.activation) + '</span><span style="text-align:right;font-weight:700;color:var(--status-error)">' + r.days + '</span><span style="color:var(--text-secondary)">' + esc(r.provider) + '</span></div>';
        }).join('');
        var delayedCard = '<div class="card" style="gap:10px"><h2 class="ctitle">DELAYED REQUESTS REQUIRING ATTENTION <span class="cap">· More than 21 Days</span></h2>'
          + '<div style="display:grid;grid-template-columns:1fr 1.4fr 0.8fr 0.8fr 0.6fr 0.7fr;gap:8px;padding:2px 12px;font:600 11px/16px var(--font-sans);color:var(--text-tertiary);text-transform:uppercase;letter-spacing:0.06em"><span>Startup</span><span>Perk or service</span><span>Requested</span><span>Activated</span><span style="text-align:right">Days</span><span>Provider</span></div>'
          + (delayed.length ? delRows : '<p class="cap">No completed requests took more than 21 days under the current filters.</p>')
          + '<p class="cap">Median turnaround is used as the primary indicator to prevent a small number of unusually delayed requests from distorting the overall performance trend. These outliers explain the gap between the average and the median in the affected cohorts.</p></div>';

        /* ---- number of requests per perk (demand, not turnaround) ---- */
        var byPerk = {};
        base.forEach(function (r) { var key = r.service || 'Unspecified'; (byPerk[key] = byPerk[key] || []).push(r); });
        var perkRows = Object.keys(byPerk).map(function (k) { return { perk: k, n: byPerk[k].length, completed: byPerk[k].filter(function (r) { return r.completed; }).length }; }).sort(function (a, b) { return b.n - a.n; });
        var maxPerkN = perkRows.length ? Math.max.apply(null, perkRows.map(function (p) { return p.n; })) : 1;
        var perkBarRows = perkRows.map(function (p) {
          return '<div style="display:flex;align-items:center;gap:12px"><span style="width:170px;flex:none;font:400 12.5px/17px var(--font-sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(p.perk) + '</span>'
            + '<div style="flex:1;height:16px;border-radius:999px;background:var(--surface-sunken)"><div title="' + p.n + ' requests · ' + p.completed + ' completed" style="height:16px;border-radius:999px;background:var(--qatar-skyline);width:' + Math.max(3, Math.round(p.n / maxPerkN * 100)) + '%"></div></div>'
            + '<span style="width:120px;flex:none;text-align:right;font:400 12.5px/17px var(--font-sans);color:var(--text-secondary)"><strong style="color:var(--text-primary)">' + p.n + '</strong> request' + (p.n === 1 ? '' : 's') + '</span></div>';
        }).join('');
        var byPerkCard = '<div class="card" style="gap:12px"><h2 class="ctitle">NUMBER OF REQUESTS PER PERK <span class="cap">· Most to Least Requested</span></h2>'
          + (perkRows.length ? perkBarRows : '<p class="cap">No Requests Match the Current Filters.</p>')
          + '<p class="cap">Counts reflect ' + provLabel + ' Requests Under the Current Filters (All Statuses, Not Just Completed). Use this to See which Perks and Services Generate the Most Demand.</p></div>';

        var turnaroundInfoTip = '<span class="infotip" tabindex="0"><span class="infoicon">i</span>'
          + '<span class="infobubble" style="width:280px"><span style="font:400 12.5px/18px var(--font-sans);color:var(--text-secondary)">Since we started processing perk requests, how has the number of days to activate them improved over time?</span></span></span>';

        /* ---- total in-kind value delivered by provider — Awaiting data.
           Innovate's own v1 metrics table flags this its single priority
           metric; the current records have no monetary value field at all. */
        var valueInfoTip = '<span class="infotip" tabindex="0"><span class="infoicon">i</span>'
          + '<span class="infobubble" style="width:300px"><span style="font:400 12.5px/18px var(--font-sans);color:var(--text-secondary)">This Tab Currently Answers "how Fast are we Processing Requests." It Cannot Answer "how much is this Programme Actually Worth to its Startups" — which, for a Client Funding the Perks Programme, may be the more Fundamental Question. Innovate\'s Operator Assigns a Value to Every Granted Perk; the Current Records Carry Status and Dates, but no Value Field. This is Innovate\'s own Top-Priority Metric in its v1 Spec.</span></span></span>';
        var valueByProvider = providers.length ? providers.map(function (pv) {
          return '<div style="display:flex;flex-direction:column;justify-content:flex-start;gap:6px;padding:16px;background:var(--neutral-25);border:1px solid var(--border-subtle);border-radius:12px">'
            + '<span style="font:800 26px/30px var(--font-sans);letter-spacing:-0.02em;color:var(--text-tertiary)">—</span>'
            + '<span class="klabel">' + esc(pv) + '</span>'
            + '<span class="chip awaiting" style="align-self:flex-start">Awaiting data</span></div>';
        }).join('') : '';
        var valueCard = '<div class="card" style="gap:12px"><div style="display:flex;align-items:baseline;gap:8px"><h2 class="ctitle">TOTAL IN-KIND VALUE DELIVERED</h2>' + valueInfoTip + '<span class="chip" style="background:var(--status-info-bg);color:var(--status-info)">Innovate Priority Metric</span></div>'
          + (valueByProvider ? ('<div class="grid-collapse" style="display:grid;grid-template-columns:repeat(' + providers.length + ',1fr);gap:14px">' + valueByProvider + '</div>') : '')
          + '<p class="cap">Broken down by Provider so it\'s Clear whether Delivered Value is Concentrated in one Vendor or Spread across Many. Populates once Perk Records Carry a Value Field.</p></div>';

        /* ---- perk approval-chain breakdown — real data, approximated.
           The current status field (New / On Hold / Activation communicated /
           Activated) doesn't distinguish "pending coach approval" from
           "pending operator approval" the way Innovate's two-step chain does,
           but it maps reasonably well onto stages of that same chain. */
        var chainBase = recs.filter(function (r) {
          return (F.startup === 'All' || r.startup === F.startup)
            && (F.service === 'All' || r.service === F.service)
            && inRange(r.requested);
        });
        var chainOrder = statusesL.length ? statusesL : ['New', 'On Hold', 'Activation communicated', 'Activated'];
        var chainCounts = chainOrder.map(function (s) { return { status: s, n: chainBase.filter(function (r) { return r.status === s; }).length }; });
        var maxChain = Math.max.apply(null, chainCounts.map(function (c) { return c.n; }).concat([1]));
        var chainRows = chainCounts.map(function (c) {
          return '<div style="display:flex;align-items:center;gap:12px"><span style="width:170px;flex:none;font:400 12.5px/17px var(--font-sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(c.status) + '</span>'

        var chainCard = '<div class="card" style="gap:12px"><h2 class="ctitle">PERK APPROVAL-CHAIN BREAKDOWN' + chainInfoTip + ' <span class="cap">· by Current Status</span></h2>'

      /* =========================================================================
         VIEW: REQUESTS — perk & service request register
         ====================================================================== */
      function reqStatusChip(status) {
        var s = (status || '').toLowerCase(), map;
        if (['activated', 'activation communicated', 'completed', 'done'].indexOf(s) >= 0) map = { bg: 'var(--status-success-bg)', c: 'var(--status-success)' };
        else if (s === 'on hold') map = { bg: 'var(--status-error-bg)', c: 'var(--status-error)' };
        else if (s === 'in progress' || s === 'pending') map = { bg: 'var(--status-warning-bg)', c: 'var(--status-warning)' };
        else if (s === 'new') map = { bg: 'var(--status-info-bg)', c: 'var(--status-info)' };
        else map = { bg: 'var(--neutral-100)', c: 'var(--neutral-700)' };
        return '<span class="chip" style="background:' + map.bg + ';color:' + map.c + '">' + esc(status || '—') + '</span>';
      }
      function reqProviderChip(prov) {
        var v = (prov || '').toLowerCase();
        if (v === 'vendor') return '<span class="chip" style="background:var(--skyline-50);color:var(--skyline-600)">Vendor</span>';
        if (v === 'mcit') return '<span class="chip" style="background:var(--sunrise-50);color:var(--sunrise-700)">MCIT</span>';
        return '<span class="chip awaiting">' + esc(prov || '—') + '</span>';
      }

      function viewRequests(M) {
        var pk = M.perks || { records: [] };
        var recs = pk.records || [];
        var F = S.req;
        var uniq = function (key) { var s = {}; recs.forEach(function (r) { if (r[key]) s[r[key]] = 1; }); return Object.keys(s).sort(); };
        var providers = uniq('provider'), startupsL = uniq('startup'), servicesL = uniq('service'), statusesL = (pk.statuses && pk.statuses.length) ? pk.statuses : uniq('status');
        var reqDates = recs.map(function (r) { return r.requested; }).filter(Boolean).sort();
        var minD = reqDates[0] || '', maxD = reqDates[reqDates.length - 1] || '';
        if (!F.init) { F.from = minD; F.to = maxD; F.init = true; }

        var inRange = function (iso) { return iso ? ((!F.from || iso >= F.from) && (!F.to || iso <= F.to)) : true; };
        var passStatus = function (r) { return F.status === 'all' ? true : F.status === 'completed' ? r.completed : r.status === F.status; };
        var filtered = recs.filter(function (r) {
          return (F.provider === 'All' || r.provider === F.provider)
            && (F.startup === 'All' || r.startup === F.startup)
            && (F.service === 'All' || r.service === F.service)
            && passStatus(r) && (r.requested ? inRange(r.requested) : true);
        });
        filtered.sort(function (a, b) {
          if (F.sort === 'days') return (b.days == null ? -1 : b.days) - (a.days == null ? -1 : a.days);
          if (F.sort === 'startup') return a.startup.localeCompare(b.startup) || (a.requested || '').localeCompare(b.requested || '');
          return (a.requested || '').localeCompare(b.requested || '') || a.startup.localeCompare(b.startup);
        });
        var vendorN = filtered.filter(function (r) { return r.provider.toLowerCase() === 'vendor'; }).length;
        var mcitN = filtered.filter(function (r) { return r.provider.toLowerCase() === 'mcit'; }).length;
        var completedN = filtered.filter(function (r) { return r.completed; }).length;
        var statusCounts = {}; filtered.forEach(function (r) { statusCounts[r.status] = (statusCounts[r.status] || 0) + 1; });
        var statusChips = Object.keys(statusCounts).sort().map(function (st) { return '<span style="display:inline-flex;align-items:center;gap:6px;font:400 12px/16px var(--font-sans);color:var(--text-secondary)">' + reqStatusChip(st) + ' ' + statusCounts[st] + '</span>'; }).join('');

        var selStyle = 'font:600 12.5px/18px var(--font-sans);color:var(--text-primary);background:var(--surface-card);border:1px solid var(--border-default);border-radius:8px;padding:7px 10px;cursor:pointer;max-width:220px';
        var inpStyle = 'font:600 12.5px/18px var(--font-sans);color:var(--text-primary);background:var(--surface-card);border:1px solid var(--border-default);border-radius:8px;padding:6px 10px';
        function opt(v, label, cur) { return '<option value="' + esc(v) + '"' + (String(cur) === String(v) ? ' selected' : '') + '>' + esc(label) + '</option>'; }
        function field(label, html) { return '<div style="display:flex;flex-direction:column;gap:4px"><span class="klabel">' + label + '</span>' + html + '</div>'; }

        var svcSel = '<select data-req="service" style="' + selStyle + '">' + opt('All', 'All services', F.service) + servicesL.map(function (v) { return opt(v, v, F.service); }).join('') + '</select>';
        var sortSel = '<select data-req="sort" style="' + selStyle + '">' + opt('requested', 'Date requested', F.sort) + opt('startup', 'Startup', F.sort) + opt('days', 'Days to activate', F.sort) + '</select>';
        var fromInp = '<input type="date" data-req="from" value="' + esc(F.from || '') + '" min="' + esc(minD) + '" max="' + esc(maxD) + '" style="' + inpStyle + '">';
        var toInp = '<input type="date" data-req="to" value="' + esc(F.to || '') + '" min="' + esc(minD) + '" max="' + esc(maxD) + '" style="' + inpStyle + '">';
        var filters = '<div class="card" style="gap:12px"><div style="display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap"><h2 class="ctitle">Filters</h2><button data-req="reset" class="ghost" style="border:1px solid var(--border-default);background:var(--surface-card);border-radius:999px;padding:6px 12px;font:600 12px/16px var(--font-sans);color:var(--text-secondary);cursor:pointer">Reset</button></div><div style="display:flex;gap:14px;flex-wrap:wrap">' + field('Provider', provSel) + field('Status', statSel) + field('Startup', startSel) + field('Service or perk', svcSel) + field('Sort by', sortSel) + field('Requested from', fromInp) + field('Requested to', toInp) + '</div></div>';

        var cols = '2fr 2.4fr 0.9fr 1.4fr 1fr 1fr 0.7fr';
        var head = '<div style="display:grid;grid-template-columns:' + cols + ';gap:8px;padding:6px 12px;font:600 11px/16px var(--font-sans);color:var(--text-tertiary);text-transform:uppercase;letter-spacing:0.06em"><span>Startup</span><span>Service or perk</span><span>Provider</span><span>Status</span><span>Requested</span><span>Activated</span><span style="text-align:right">Days</span></div>';
        var rows = filtered.map(function (r) {

            + '<span style="font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(r.startup) + '</span>'
            + '<span style="color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(r.service) + '</span>'
            + '<span>' + reqProviderChip(r.provider) + '</span>'
            + '<span>' + reqStatusChip(r.status) + '</span>'
            + '<span>' + fmtDMY(r.requested) + '</span>'
            + '<span>' + fmtDMY(r.activation) + '</span>'
            + '<span style="text-align:right;font-weight:600">' + daysTxt + '</span></div>';
        }).join('');
        var table = '<div class="card" style="gap:8px"><h2 class="ctitle">All requests <span class="cap">· ' + filtered.length + ' of ' + recs.length + '</span></h2>'
          + '<div style="overflow-x:auto"><div style="min-width:820px;display:flex;flex-direction:column;gap:6px">' + head + (filtered.length ? rows : '<p class="cap">No requests match the current filters.</p>') + '</div></div>'
          + '<p class="cap">Days to activate = activation date − date requested (calendar days). "pending" means the request is not yet activated or communicated.</p></div>';

        return ''
          + '<div style="display:flex;flex-direction:column;gap:20px">'
          + '<div class="card" style="gap:8px"><span class="eyebrow">Perk and Service requests</span><h1 style="font:700 26px/34px var(--font-sans);letter-spacing:-0.01em">Cohort 12 Perk and Service Request Register</h1>'
          + '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">' + scopeChip('cohort') + '<span class="chip" style="background:var(--skyline-50);color:var(--skyline-600)">' + filtered.length + ' Shown</span><span class="chip" style="background:var(--surface-brand-soft);color:var(--text-brand)">' + vendorN + ' Vendor · ' + mcitN + ' MCIT</span><span class="chip" style="background:var(--status-success-bg);color:var(--status-success)">' + completedN + ' Completed</span></div>'
          + (statusChips ? '<div style="display:flex;gap:14px;flex-wrap:wrap;padding-top:6px">' + statusChips + '</div>' : '') + '</div>'
          + filters
          + table
          + '</div>';
      }

      /* =========================================================================

      /* Display Mode was originally built as a fixed-scale lobby/kiosk screen

      function buildOverlay(M) {

          { value: M.health.off, color: HEALTH_COLORS[2] }
         ].filter(function (s) { return s.value > 0; }), donutSize, Math.round(donutSize * 0.13));
        var attDelta = (M.attTargetNum != null) ? (M.wsAttRate - M.attTargetNum) : null;
         var dmLegend = function (sw, label, val) { return '<div class="dic-dm-legend-row" style="display:flex;align-items:center;gap:12px;white-space:nowrap"><span style="width:14px;height:14px;border-radius:4px;background:' + sw + ';flex:none"></span><span style="font:400 16px/22px var(--font-sans)"><strong>' + val + '</strong> ' + label + '</span></div>'; };

        var wsW = WS_COHORT_SCOPE_D ? (M.wsDelivered / WS_COHORT_SCOPE_D * 100) : 0;
        function dmTile(exitTo, iconKey, iconBg, big, den, label, color, bar) {
          /* Icon and the number+label group sit at opposite ends
             (justify-content:space-between) rather than clustered in the
             middle (justify-content:center) — once Round 30 stretches this
             card to fill a tall grid row, a centered cluster leaves a big
             empty gap above and below it; anchoring the icon to the top edge

             floating in the middle of it. */
          return '<div class="card" style="padding:18px;justify-content:space-between;gap:8px">'

          + '<div style="display:flex;flex-direction:column;gap:12px">'
          + '<div style="display:flex;align-items:center;gap:10px"><span class="eyebrow">Cohort 12 · Week 9</span></div>'

          + '</div>'

          + dmTile('Delivery', 'trending', 'var(--green-600)', M.wsAttRate + '%', '', 'Attendance · target ' + (M.attTargetStr || '—'), 'var(--green-600)')
          + dmTile('Delivery', 'mic', 'var(--qatar-maroon)', M.wsAvgSat ? rating5(M.wsAvgSat).toFixed(1) : '—', '/ 5', 'Workshop satisfaction', 'var(--green-600)')
          + dmTile('Coaching', 'clock', 'var(--qatar-blue)', hnum(M.coachHours), 'h', 'Coaching hours')

          + '<div style="display:flex;align-items:center;gap:10px">' + dmIcon('building', 'var(--qatar-skyline)') + '<div style="display:flex;flex-direction:column"><span style="font:800 26px/28px var(--font-sans);letter-spacing:-0.02em">' + M.cohortSize + '</span><span class="klabel">Startups incubated</span></div></div>'

          + '<div style="display:flex;align-items:center;gap:10px">' + dmIcon('megaphone', 'var(--qatar-blue)') + '<div style="display:flex;flex-direction:column"><span style="font:800 26px/28px var(--font-sans);letter-spacing:-0.02em">' + nfmt(M.totalFollowers) + '</span><span class="klabel">Community followers</span></div></div>'

          + '</div>'
          + '</div>';

        /* ---- Board B: Programme impact (pending figures shown honestly) ---- */
        var impactOrder = ['fundingRaisedQAR', 'monthlyRevenueQAR', 'jobsCreated', 'milestoneCompletion'];
        var impactLabels = { fundingRaisedQAR: 'Funding raised by DIC startups', monthlyRevenueQAR: 'Revenue generated by DIC startups', jobsCreated: 'Jobs created by DIC startups', milestoneCompletion: 'Programme milestones completed' };
        var impactTiles = impactOrder.map(function (k) {
          var e = M.impact[k]; var has = e && e.value != null;
          var val = has ? impactVal(k, e.value) : '—';
          var valueClass = k === 'milestoneCompletion' ? 'dic-dm-impact-value dic-dm-impact-dark' : 'dic-dm-impact-value';
          var valueHtml = (/QAR/.test(k) && has)
            ? '<span class="dic-dm-impact-currency">QAR</span>' + val.replace(/^QAR\s+/, '')
            : val;
          return '<div class="card dic-dm-impact-tile">'
            + '<div style="display:flex;flex-direction:column;gap:8px">'
            + '<span class="' + valueClass + '" style="' + (has ? '' : 'color:var(--text-tertiary)') + '">' + valueHtml + '</span>'
            + '<span class="klabel">' + impactLabels[k] + (has ? '' : ' · awaiting data') + '</span></div></div>';
        }).join('');
        var totalIncubatedD = M.impact.totalIncubatedStartups;
        var hasTotalD = totalIncubatedD && totalIncubatedD.value != null;
        var activeStartupsD = M.impact.activeStartups;
        var hasActiveD = activeStartupsD && activeStartupsD.value != null;
        var founderMetric = function (key, label) {
          var e = M.impact[key];
          var has = e && e.value != null;
          return '<div class="dic-dm-founder-stat"><span class="dic-dm-founder-value" style="' + (has ? '' : 'color:var(--text-tertiary)') + '">' + (has ? nfmt(e.value) : '—') + '</span><span class="klabel">' + label + '</span></div>';
        };
        var founderTile = '<div class="card dic-dm-impact-tile dic-dm-founder-tile">'
          + founderMetric('qatariFounders', 'Qatari founders')
          + founderMetric('femaleFounders', 'Female founders')
          + '</div>';

        var boardB = '<div class="dic-board dic-dm-impact-board" data-board-el="1" style="display:grid;grid-template-columns:1.35fr 3fr;gap:14px">'
          + '<div class="card dic-dm-impact-hero">'
          + '<span class="eyebrow">All cohorts · since inception</span>'
          + '<span class="dic-dm-impact-hero-value">' + (hasTotalD ? nfmt(totalIncubatedD.value) : '—') + '</span>'
          + '<span class="klabel">Startups incubated</span>'
          + '<span class="dic-dm-impact-hero-sub">across 12 delivered cohorts · Cohort 12 in progress</span>'
          + (hasActiveD ? '<span class="chip" style="align-self:flex-start;background:var(--qatar-green);color:#fff">' + nfmt(activeStartupsD.value) + ' active today</span>' : '')
          + '</div>'
          + '<div class="grid-collapse dic-dm-impact-grid" style="display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:14px">' + impactTiles + founderTile + '</div>'
          + '<div style="grid-column:1 / -1;display:flex;align-items:center;justify-content:space-between;gap:20px">' + scopeChip('programme') + '<span style="font:400 13px/18px var(--font-sans);color:var(--text-tertiary)">Impact figures pending final validation · updated weekly</span></div>'
          + '</div>';

        var overlay = document.createElement('div');
        overlay.id = 'dic-overlay';
        overlay.style.cssText = 'position:fixed;inset:0;z-index:100;background:var(--surface-page);color:var(--text-primary);display:none;flex-direction:column;padding:24px 28px;gap:18px;overflow-y:auto';
        overlay.innerHTML = ''
          + '<div class="dic-ov-header" style="display:flex;align-items:center;justify-content:space-between;gap:16px;flex:none">'
          + '<div style="display:flex;flex-direction:column"><span style="font:700 19px/24px var(--font-sans);color:var(--text-primary)">DIC Performance<span style="color:var(--qatar-maroon)">.</span></span><span style="font:400 11px/15px var(--font-sans);color:var(--text-tertiary)">' + esc(M.meta.programme || '') + ' · MCIT · ' + esc(M.meta.operator || '') + '</span></div>'
          + '<div style="display:flex;align-items:center;gap:4px;background:var(--neutral-100);border-radius:999px;padding:4px">'
           + '<button data-board="1" class="dic-board-btn" style="cursor:pointer;border:none;border-radius:999px;padding:8px 16px;font:600 12.5px/16px var(--font-sans);transition:background 250ms cubic-bezier(0.2,0,0,1),color 250ms cubic-bezier(0.2,0,0,1)">Programme impact</button>'
           + '<button data-board="0" class="dic-board-btn" style="cursor:pointer;border:none;border-radius:999px;padding:8px 16px;font:600 12.5px/16px var(--font-sans);transition:background 250ms cubic-bezier(0.2,0,0,1),color 250ms cubic-bezier(0.2,0,0,1)">Cohort 12 · live</button>'
          + '</div>'
          + '<div class="dic-ov-actions" style="display:flex;align-items:center;gap:14px"><span class="dic-ov-asof" style="font:400 12px/16px var(--font-sans);color:var(--text-tertiary)">Figures as published · ' + esc(M.meta.asOf || '') + '</span>'
           + '<button id="dic-pause-btn" class="ghost" data-display="pause" style="cursor:pointer;background:var(--surface-card);border:1px solid var(--border-default);color:var(--text-secondary);border-radius:999px;padding:0 14px;height:34px;font:600 12px/16px var(--font-sans)">Pause</button>'
           + '<button class="ghost" data-display="off" style="cursor:pointer;background:var(--surface-card);border:1px solid var(--border-default);color:var(--text-secondary);border-radius:999px;padding:0 14px;height:34px;font:600 12px/16px var(--font-sans)">Exit</button></div>'
          + '</div>'
          + '<div class="dic-ov-boards" style="position:relative;display:flex;flex-direction:column;justify-content:center;flex:1;min-height:0">' + boardA + boardB
          + '<div class="dic-ov-progress-track" style="position:absolute;left:0;right:0;bottom:4px;height:4px;border-radius:999px;background:var(--neutral-200);overflow:hidden"><div id="dic-progress" style="height:100%;background:var(--qatar-maroon);transform-origin:left"></div></div>'
          + '</div>';
        return overlay;
      }

      function applyBoard() {
        var overlay = document.getElementById('dic-overlay'); if (!overlay) return;
        overlay.querySelectorAll('[data-board-el]').forEach(function (el) {
          var on = Number(el.getAttribute('data-board-el')) === S.board;
          /* Boards render in normal document flow now (no absolute crossfade),
             so a plain display:none/grid toggle via this class is the whole
             mechanism — see the base .dic-board rule in <style>. */
          el.classList.toggle('dic-board-active', on);
        });
        overlay.querySelectorAll('.dic-board-btn').forEach(function (b) {
          var on = Number(b.getAttribute('data-board')) === S.board;
          b.style.background = on ? 'var(--qatar-maroon)' : 'transparent';
          b.style.color = on ? '#FFFFFF' : 'var(--text-secondary)';
        });
        /* restart progress fill so the 10s bar replays on every board change */
        var old = document.getElementById('dic-progress');
        if (old) {
          var fresh = old.cloneNode(true);
          fresh.style.animation = 'none'; old.parentNode.replaceChild(fresh, old);
          void fresh.offsetWidth;    /* reflow to reset animation */
          fresh.style.animation = (S.board === 0 ? 'dicFillA' : 'dicFillB') + ' 10s linear forwards';
        }
      }
      function startBoards() { stopBoards(); applyBoard(); boardTimer = setInterval(function () { S.board = S.board === 0 ? 1 : 0; applyBoard(); }, 10000); }
      function stopBoards() { if (boardTimer) { clearInterval(boardTimer); boardTimer = null; } }
      /* Display mode auto-rotates every 10s; this lets a kiosk or a presenter
         hold on one board instead of it always cycling. */
      function togglePause() {
        S.paused = !S.paused;
        var btn = document.getElementById('dic-pause-btn');
        var bar = document.getElementById('dic-progress');
        if (S.paused) {
          stopBoards();
          if (bar) bar.style.animationPlayState = 'paused';
          if (btn) btn.textContent = 'Resume';
        } else {
          startBoards();
          if (btn) btn.textContent = 'Pause';
        }
      }

      /* =========================================================================
         RENDER + WIRING
         ====================================================================== */
      var MODEL = null;

      function renderView(M) {
        switch (S.view) {
          case 'Overview': return viewOverview(M);
          case 'Delivery': return viewDelivery(M);
          case 'Startups': return viewStartups(M);
          case 'Coaching': return viewCoaching(M);
          case 'Mentorship': return viewMentorship(M);
          case 'Social Media Performance': return viewCommunity(M);
          case 'Perks': return viewPerks(M);
          default: return viewOverview(M);
        }
      }

      function render() {
        var M = MODEL;
        var root = document.getElementById('dic-root');
        root.innerHTML = renderNav(M)
          + renderMobileMenu(M)
          + '<div style="max-width:1120px;margin:0 auto;padding:28px 24px 48px;display:flex;flex-direction:column;gap:20px">'
          + renderView(M) + '</div>';
        wireNavFade();
      }

      /* Shows a soft edge fade whenever the tab strip has more views than fit on
         screen, so a scrollable nav no longer looks like a complete list. */
      function wireNavFade() {
        var sc = document.getElementById('dic-navscroll');
        var fl = document.getElementById('dic-navfade-l'), fr = document.getElementById('dic-navfade-r');
        if (!sc || !fl || !fr) return;
        function update() {
          var overflow = sc.scrollWidth > sc.clientWidth + 2;
          fl.style.opacity = (overflow && sc.scrollLeft > 2) ? '1' : '0';
          fr.style.opacity = (overflow && sc.scrollLeft + sc.clientWidth < sc.scrollWidth - 2) ? '1' : '0';
        }
        sc.addEventListener('scroll', update);
        update();
      }

      function slug(v) { return v.toLowerCase().replace(/\s+/g, ''); }

      function setView(v, tab) {
        if (VIEWS.indexOf(v) < 0) return;
        S.view = v; S.expanded = null; S.navOpen = null; S.mobileNavOpen = false; S.startupModal = null;
        if (tab) S.deliveryTab = tab;
        if (location.hash !== '#' + slug(v)) history.replaceState(null, '', '#' + slug(v));
        render();
        window.scrollTo(0, 0);
      }

      function enterDisplay() {
        S.display = true; S.board = 1; S.paused = false; S.mobileNavOpen = false;
        document.documentElement.style.overflow = 'hidden';
        document.body.style.overflow = 'hidden';
        document.getElementById('dic-overlay').style.display = 'flex';
        var btn = document.getElementById('dic-pause-btn'); if (btn) btn.textContent = 'Pause';
        startBoards();
      }
      function exitDisplay(toView, tab) {
        S.display = false;
        stopBoards();
        document.documentElement.style.overflow = '';
        document.body.style.overflow = '';
        document.getElementById('dic-overlay').style.display = 'none';
        if (toView) setView(toView, tab);
      }

      /* click delegation */
      function onClick(e) {
        var loginBtn = e.target.closest ? e.target.closest('[data-login-action]') : null;
        if (loginBtn) {
          e.preventDefault();
          var action = loginBtn.getAttribute('data-login-action');
          if (action === 'login') submitLogin();
          else if (action === 'forgot') { S.loginStep = 'forgot'; S.loginError = null; S.loginNotice = null; renderLoginScreen(); }
          else if (action === 'signup') { S.loginStep = 'signup'; S.loginError = null; S.loginNotice = null; renderLoginScreen(); }
          else if (action === 'create-account') submitSignup();
          else if (action === 'request-reset') submitForgotPassword();
          else if (action === 'resend-reset') submitForgotPassword(true);
          else if (action === 'reset') submitResetPassword();
          else if (action === 'back') { S.loginStep = 'login'; S.loginError = null; S.loginNotice = null; renderLoginScreen(); }
          return;
        }
        var logoutBtn = e.target.closest ? e.target.closest('[data-logout]') : null;
        if (logoutBtn) { e.preventDefault(); doLogout(); return; }
        var reset = e.target.closest ? e.target.closest('[data-perk="reset"]') : null;
        if (reset) { S.perk = { provider: 'All', status: 'completed', startup: 'All', service: 'All', from: null, to: null, init: false }; render(); return; }
        var rreset = e.target.closest ? e.target.closest('[data-req="reset"]') : null;
        if (rreset) { S.req = { provider: 'All', status: 'all', startup: 'All', service: 'All', from: null, to: null, sort: 'requested', init: false }; render(); return; }
        var dreset = e.target.closest ? e.target.closest('[data-deliv="reset"]') : null;
        if (dreset) { S.deliv = { from: null, to: null, init: true }; render(); return; }
        var mobileToggle = e.target.closest ? e.target.closest('[data-mobile-toggle]') : null;
        if (mobileToggle) { e.preventDefault(); S.mobileNavOpen = !S.mobileNavOpen; S.navOpen = null; render(); return; }
        var mobileClose = e.target.closest ? e.target.closest('[data-mobile-close]') : null;
        if (mobileClose) { e.preventDefault(); S.mobileNavOpen = false; render(); return; }
        var navGroupEl = e.target.closest ? e.target.closest('[data-navgroup]') : null;
        if (navGroupEl) {
          var ngName = navGroupEl.getAttribute('data-navgroup');
          S.navOpen = (S.navOpen === ngName) ? null : ngName;
          render();
          return;
        }
        var navDropdownEl = e.target.closest ? e.target.closest('[data-navdropdown]') : null;
        if (S.navOpen && !navDropdownEl) { S.navOpen = null; render(); return; }
        /* Startup ranking card / podium click → open its detail popup.
           A dedicated close button and a click on the dimmed backdrop
           (but not the popup panel itself) both close it. */
        var startupOpen = e.target.closest ? e.target.closest('[data-startup-open]') : null;
        if (startupOpen) { S.startupModal = startupOpen.getAttribute('data-startup-open'); render(); return; }
        if (e.target.id === 'dic-startup-modal-backdrop' || (e.target.closest && e.target.closest('[data-startup-close]'))) {
          S.startupModal = null; render(); return;
        }
        var t = e.target.closest('[data-view],[data-tab],[data-plat],[data-expand],[data-display],[data-board],[data-exit-to]');
        if (!t) return;
        if (t.hasAttribute('data-exit-to')) {
          e.preventDefault();
          var parts = t.getAttribute('data-exit-to').split('|');
          exitDisplay(parts[0], parts[1]);
          return;
        }
        if (t.hasAttribute('data-board')) { S.paused = false; S.board = Number(t.getAttribute('data-board')); startBoards(); return; }
        if (t.hasAttribute('data-display')) {
          var dm = t.getAttribute('data-display');
          if (dm === 'on') enterDisplay(); else if (dm === 'pause') togglePause(); else exitDisplay();
          return;
        }
        if (t.hasAttribute('data-view')) { e.preventDefault(); setView(t.getAttribute('data-view'), t.getAttribute('data-tab')); return; }
        if (t.hasAttribute('data-tab')) { S.deliveryTab = t.getAttribute('data-tab'); render(); return; }
        if (t.hasAttribute('data-plat')) { S.platform = t.getAttribute('data-plat'); render(); return; }
        if (t.hasAttribute('data-expand')) { var name = t.getAttribute('data-expand'); S.expanded = (S.expanded === name) ? null : name; render(); return; }
      }

      function onHashChange() {
        var h = (location.hash || '').replace('#', '').toLowerCase();
        if (!h) return;
        var match = VIEWS.filter(function (v) { return slug(v) === h; })[0];
        if (match && match !== S.view && !S.display) { S.view = match; S.expanded = null; render(); }
      }

      /* =========================================================================
         BOOT — wait for the data global, then mount.
         ====================================================================== */
      /* =========================================================================
         LOGIN GATE — approved-domain sign-up, email/password sign-in, and
         Microsoft organization sign-in are verified server-side by /api/*.
         The dashboard's own
         render()/renderNav()/etc. above never run until checkAuthAndMount()
         confirms a session; until then, #dic-root only ever holds the login
         screen built by renderLoginScreen().
         ====================================================================== */
      function renderLoginScreen() {

        if (!root) return;
        var inpStyle = 'font:500 15px/22px var(--font-sans);color:var(--text-primary);background:var(--surface-card);border:1px solid var(--border-default);border-radius:10px;padding:12px 14px;width:100%';
        var btnStyle = 'width:100%;height:44px;border-radius:10px;border:none;cursor:pointer;font:700 14px/20px var(--font-sans);background:var(--qatar-maroon);color:#fff';
        var ghostBtnStyle = 'width:100%;height:40px;border-radius:10px;border:1px solid var(--border-default);cursor:pointer;font:600 13px/18px var(--font-sans);background:var(--surface-card);color:var(--text-secondary)';
        var linkBtnStyle = 'background:none;border:none;cursor:pointer;padding:0;font:600 12.5px/18px var(--font-sans);color:var(--text-brand);text-align:center;width:100%';
        var errorHtml = S.loginError ? ('<p style="font:600 12.5px/18px var(--font-sans);color:var(--status-error);background:var(--status-error-bg);border-radius:8px;padding:8px 12px">' + esc(S.loginError) + '</p>') : '';
        var noticeHtml = ((S.loginStep === 'reset' || S.loginStep === 'login') && S.loginNotice) ? ('<p class="cap" style="text-align:center">' + esc(S.loginNotice) + '</p>') : '';
        var offlineHtml = S.loginOffline ? '<p style="font:400 12px/18px var(--font-sans);color:var(--text-tertiary);text-align:center"></p>' : '';

        var body;
        if (S.loginChecking) {
          body = '<p class="cap" style="text-align:center;padding:8px 0">Checking your sign-in status…</p>';
        } else if (S.loginStep === 'forgot') {
          body = ''
            + '<p style="font:400 13.5px/20px var(--font-sans);color:var(--text-secondary);text-align:center">Enter your account email and we’ll send a password reset code, if that email has an account.</p>'
            + '<div style="display:flex;flex-direction:column;gap:6px">'
            + '<label class="klabel" for="dic-login-email">Email</label>'
            + '<input id="dic-login-email" type="email" autocomplete="email" value="' + esc(S.loginEmail) + '" placeholder="you@mcit.gov.qa" style="' + inpStyle + '">'
            + '</div>'
            + errorHtml
            + '<button data-login-action="request-reset" style="' + btnStyle + (S.loginBusy ? ';opacity:0.6' : '') + '"' + (S.loginBusy ? ' disabled' : '') + '>' + (S.loginBusy ? 'Sending…' : 'Send reset code') + '</button>'
            + '<button data-login-action="back" style="' + ghostBtnStyle + '">Back to sign in</button>';
        } else if (S.loginStep === 'reset') {
          body = ''
            + '<p style="font:400 13.5px/20px var(--font-sans);color:var(--text-secondary);text-align:center">If <strong style="color:var(--text-primary)">' + esc(S.loginEmail) + '</strong> has an account, we sent it a 6-digit reset code.</p>'
            + noticeHtml
            + '<div style="display:flex;flex-direction:column;gap:6px">'
            + '<label class="klabel" for="dic-login-code">Reset code</label>'
            + '<input id="dic-login-code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000" style="' + inpStyle + ';letter-spacing:6px;text-align:center;font:700 20px/26px var(--font-sans)">'
            + '</div>'
            + '<div style="display:flex;flex-direction:column;gap:6px">'
            + '<label class="klabel" for="dic-login-newpassword">New password</label>'
            + '<input id="dic-login-newpassword" type="password" autocomplete="new-password" placeholder="At least 8 characters" style="' + inpStyle + '">'
            + '</div>'
            + errorHtml
            + '<button data-login-action="reset" style="' + btnStyle + (S.loginBusy ? ';opacity:0.6' : '') + '"' + (S.loginBusy ? ' disabled' : '') + '>' + (S.loginBusy ? 'Resetting…' : 'Reset password & sign in') + '</button>'
            + '<button data-login-action="resend-reset" style="' + ghostBtnStyle + '"' + (S.loginBusy ? ' disabled' : '') + '>Resend code</button>'
            + '<button data-login-action="back" style="' + ghostBtnStyle + '">Back to sign in</button>';
        } else if (S.loginStep === 'signup') {
          body = ''
            + '<p style="font:400 13.5px/20px var(--font-sans);color:var(--text-secondary);text-align:center">Create an account with your approved DIC organization email.</p>'
            + '<div style="display:flex;flex-direction:column;gap:6px">'
            + '<label class="klabel" for="dic-signup-email">Email</label>'
            + '<input id="dic-signup-email" type="email" autocomplete="email" value="' + esc(S.loginEmail) + '" placeholder="you@example.com" style="' + inpStyle + '">'
            + '</div>'
            + '<div style="display:flex;flex-direction:column;gap:6px">'
            + '<label class="klabel" for="dic-signup-password">Password</label>'
            + '<input id="dic-signup-password" type="password" autocomplete="new-password" placeholder="At least 8 characters" style="' + inpStyle + '">'
            + '</div>'
            + '<div style="display:flex;flex-direction:column;gap:6px">'
            + '<label class="klabel" for="dic-signup-confirm">Confirm password</label>'
            + '<input id="dic-signup-confirm" type="password" autocomplete="new-password" placeholder="Re-enter your password" style="' + inpStyle + '">'
            + '</div>'
            + errorHtml
            + '<button data-login-action="create-account" style="' + btnStyle + (S.loginBusy ? ';opacity:0.6' : '') + '"' + (S.loginBusy ? ' disabled' : '') + '>' + (S.loginBusy ? 'Creating account…' : 'Create account') + '</button>'
            + '<button data-login-action="back" style="' + ghostBtnStyle + '">Back to sign in</button>';
        } else {
          body = ''
            + '<p style="font:400 13.5px/20px var(--font-sans);color:var(--text-secondary);text-align:center">Sign in with the email and password provided to you by the DIC programme team.</p>'
            + noticeHtml
            + '<div style="display:flex;flex-direction:column;gap:6px">'
            + '<label class="klabel" for="dic-login-email">Email</label>'
            + '<input id="dic-login-email" type="email" autocomplete="email" value="' + esc(S.loginEmail) + '" placeholder="you@example.com" style="' + inpStyle + '">'
            + '</div>'
            + '<div style="display:flex;flex-direction:column;gap:6px">'
            + '<label class="klabel" for="dic-login-password">Password</label>'
            + '<input id="dic-login-password" type="password" autocomplete="current-password" placeholder="••••••••" style="' + inpStyle + '">'
            + '</div>'
            + errorHtml
            + '<button data-login-action="login" style="' + btnStyle + (S.loginBusy ? ';opacity:0.6' : '') + '"' + (S.loginBusy ? ' disabled' : '') + '>' + (S.loginBusy ? 'Signing in…' : 'Sign in') + '</button>'
            + '<div style="display:flex;align-items:center;gap:10px;color:var(--text-tertiary);font:400 11px/14px var(--font-sans)"><div style="flex:1;height:1px;background:var(--border-default)"></div>or<div style="flex:1;height:1px;background:var(--border-default)"></div></div>'
            + '<p style="text-align:center;font:400 13px/18px var(--font-sans);color:var(--text-secondary);margin:0">New to DIC? <button data-login-action="signup" style="background:none;border:none;cursor:pointer;padding:0;font:700 13px/18px var(--font-sans);color:var(--text-brand)">Create an account</button></p>'
            + '<button data-login-action="forgot" style="' + linkBtnStyle + '">Forgot password?</button>'
            + offlineHtml;
        }

        root.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px">'
          + '<div class="card" style="width:100%;max-width:380px;gap:16px;padding:32px 28px">'
          + '<div style="display:flex;flex-direction:column;gap:2px;text-align:center">'
          + '<span style="font:700 20px/26px var(--font-sans);color:var(--text-primary)">DIC Performance<span style="color:var(--qatar-maroon)">.</span></span>'
          + '<span class="cap">Digital Incubation Center · MCIT · Operated by Ibtechar</span>'
          + '</div>'
          + '<form onsubmit="return false" style="display:flex;flex-direction:column;gap:16px">'
          + body
          + '</form>'
          + '</div></div>';

        var focusId = S.loginStep === 'reset' ? 'dic-login-code' : (S.loginStep === 'signup' ? 'dic-signup-email' : 'dic-login-email');
        var focusEl = document.getElementById(focusId);
        if (focusEl) focusEl.focus();
      }

      function submitLogin() {
        var emailInput = document.getElementById('dic-login-email');
        var passwordInput = document.getElementById('dic-login-password');
        var email = emailInput ? emailInput.value.trim() : '';
        var password = passwordInput ? passwordInput.value : '';
        if (!email || !password) { S.loginError = 'Enter your email and password.'; renderLoginScreen(); return; }
        S.loginEmail = email;
        S.loginBusy = true; S.loginError = null; renderLoginScreen();
        fetch('/api/login', {
          method: 'POST', credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: email, password: password })
        }).then(function (r) { return r.json().then(function (data) { return { ok: r.ok, data: data }; }); })
          .then(function (result) {
            S.loginBusy = false;
            if (result.ok && result.data && result.data.ok) {
              mountDashboard(result.data.email);
            } else {
              S.loginError = (result.data && result.data.error) || 'Incorrect email or password.';
              renderLoginScreen();
            }
          })
          .catch(function () {
            S.loginBusy = false;
            S.loginError = 'Could not reach the sign-in service. Please try again.';
            renderLoginScreen();
          });
      }

      function submitSignup() {
        var emailInput = document.getElementById('dic-signup-email');
        var passwordInput = document.getElementById('dic-signup-password');
        var confirmInput = document.getElementById('dic-signup-confirm');
        var email = emailInput ? emailInput.value.trim() : '';
        var password = passwordInput ? passwordInput.value : '';
        var confirmPassword = confirmInput ? confirmInput.value : '';
        if (!email || !password || !confirmPassword) { S.loginError = 'Fill in all fields.'; renderLoginScreen(); return; }
        if (password.length < 8) { S.loginError = 'Password must be at least 8 characters.'; renderLoginScreen(); return; }
        if (password !== confirmPassword) { S.loginError = 'Passwords do not match.'; renderLoginScreen(); return; }
        S.loginEmail = email;
        S.loginBusy = true; S.loginError = null; renderLoginScreen();
        fetch('/api/signup', {
          method: 'POST', credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: email, password: password, confirmPassword: confirmPassword })
        }).then(function (r) { return r.json().then(function (data) { return { ok: r.ok, data: data }; }); })
          .then(function (result) {
            S.loginBusy = false;
            if (result.ok && result.data && result.data.ok) {
              S.loginStep = 'login'; S.loginError = null;
              S.loginNotice = 'Account created. Sign in below with your email and password.';
              renderLoginScreen();
            } else {
              S.loginError = (result.data && result.data.error) || 'Could not create your account.';
              renderLoginScreen();
            }
          })
          .catch(function () {
            S.loginBusy = false;
            S.loginError = 'Could not reach the sign-up service. Please try again.';
            renderLoginScreen();
          });
      }

      function submitForgotPassword(isResend) {
        var email;
        if (isResend) {
          email = S.loginEmail;
        } else {
          var input = document.getElementById('dic-login-email');
          email = input ? input.value.trim() : '';
        }
        if (!email) { S.loginError = 'Enter your email address.'; renderLoginScreen(); return; }
        S.loginBusy = true; S.loginError = null; renderLoginScreen();
        fetch('/api/request-password-reset', {
          method: 'POST', credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: email })
        }).then(function (r) { return r.json().then(function (data) { return { ok: r.ok, data: data }; }); })
          .then(function (result) {
            S.loginBusy = false;
            if (result.ok && result.data && result.data.ok) {
              S.loginEmail = email; S.loginStep = 'reset'; S.loginError = null; S.loginNotice = result.data.message || null;
            } else {
              S.loginError = (result.data && result.data.error) || 'Something went wrong. Please try again.';
            }
            renderLoginScreen();
          })
          .catch(function () {
            S.loginBusy = false;
            S.loginError = 'Could not reach the sign-in service. Please try again.';
            renderLoginScreen();
          });
      }

      function submitResetPassword() {
        var codeInput = document.getElementById('dic-login-code');
        var passwordInput = document.getElementById('dic-login-newpassword');
        var code = codeInput ? codeInput.value.trim() : '';
        var newPassword = passwordInput ? passwordInput.value : '';
        if (!/^\d{6}$/.test(code)) { S.loginError = 'Enter the 6-digit code from your email.'; renderLoginScreen(); return; }
        if (!newPassword || newPassword.length < 8) { S.loginError = 'Choose a password at least 8 characters long.'; renderLoginScreen(); return; }
        S.loginBusy = true; S.loginError = null; renderLoginScreen();
        fetch('/api/reset-password', {
          method: 'POST', credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: S.loginEmail, code: code, newPassword: newPassword })
        }).then(function (r) { return r.json().then(function (data) { return { ok: r.ok, data: data }; }); })
          .then(function (result) {
            S.loginBusy = false;
            if (result.ok && result.data && result.data.ok) {
              mountDashboard(result.data.email);
            } else {
              S.loginError = (result.data && result.data.error) || 'Incorrect code. Please try again.';
              renderLoginScreen();
            }
          })
          .catch(function () {
            S.loginBusy = false;
            S.loginError = 'Could not reach the sign-in service. Please try again.';
            renderLoginScreen();
          });
      }

      function doLogout() {
        fetch('/api/logout', { method: 'POST', credentials: 'include' }).then(function () {
          window.location.replace('/');
        });
      }

      function onLoginKeydown(e) {
        if (e.key !== 'Enter') return;
        if (!e.target || !e.target.id) return;
        if (e.target.id === 'dic-login-email' || e.target.id === 'dic-login-password') {
          e.preventDefault();
          if (S.loginStep === 'forgot') submitForgotPassword(false); else submitLogin();
        } else if (e.target.id === 'dic-login-code' || e.target.id === 'dic-login-newpassword') {
          e.preventDefault();
          submitResetPassword();
        } else if (e.target.id === 'dic-signup-email' || e.target.id === 'dic-signup-password' || e.target.id === 'dic-signup-confirm') {
          e.preventDefault();
          submitSignup();
        }
      }

      function mountDashboard(email) {
        S.authedEmail = email;
        render();
        var overlay = buildOverlay(MODEL);
        document.body.appendChild(overlay);
        if (S.display) enterDisplay();
      }

      function checkAuthAndMount() {
        renderLoginScreen();
        fetch('/api/session', { credentials: 'include' })
          .then(function (r) { return r.json(); })
          .then(function (data) {
            S.loginChecking = false;
            if (data && data.authenticated) { mountDashboard(data.email); }
            else { renderLoginScreen(); }
          })
          .catch(function () {
            // No /api/session reachable — most likely this file is being opened
            // directly (file://) rather than served through its deployed site
            // alongside the login backend. Fail safe to the login screen
            // rather than silently showing the dashboard unauthenticated.
            S.loginChecking = false;
            S.loginOffline = true;
            renderLoginScreen();
          });
      }

      /* =========================================================================
         BOOT — wait for the data global, then mount.
         ====================================================================== */
      function boot() {
        if (!window.DIC_DATA) { setTimeout(boot, 60); return; }
        MODEL = buildModel(window.DIC_DATA);

        var h = (location.hash || '').replace('#', '').toLowerCase();
        var match = VIEWS.filter(function (v) { return slug(v) === h; })[0];
        if (match) S.view = match;

        document.addEventListener('click', onClick);
        document.addEventListener('keydown', onLoginKeydown);
        document.addEventListener('change', function (e) {
          var t = e.target;
          if (!t || !t.closest) return;
          var sel = t.closest('[data-startup-select]');
          if (sel) { S.startup = sel.value; render(); return; }
          var coh = t.closest('[data-cohort-select]');
          if (coh) { S.cohort = coh.value; render(); return; }
          var pf = t.closest('[data-perk]');
          if (pf) { var k = pf.getAttribute('data-perk'); if (k !== 'reset') { S.perk[k] = pf.value; render(); } return; }
          var rf = t.closest('[data-req]');
          if (rf) { var rk = rf.getAttribute('data-req'); if (rk !== 'reset') { S.req[rk] = rf.value; render(); } return; }
          var df = t.closest('[data-deliv]');
          if (df) { var dk = df.getAttribute('data-deliv'); if (dk !== 'reset') { S.deliv[dk] = df.value || null; render(); } }
        });
        window.addEventListener('hashchange', onHashChange);

        checkAuthAndMount();
      }
      boot();

    })();
  </script>
</body>

</html>
